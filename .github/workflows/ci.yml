name: CI

on:
  push:
    branches: [main]
  # Every base branch, so stacked PRs and PRs into `next` get the same checks.
  pull_request:
  merge_group:
  workflow_dispatch:

# A newer push to the same ref cancels the run still in progress, main included.
# A full run costs about 200 runner-minutes against the org's 20 concurrent
# jobs, and a superseded main run only answers a question the newer commit
# answers again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ steps.filter.outputs.browser }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/docker-container.test.mjs scripts/rebrand-clisbot.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/channel-upstream-sync.test.mjs scripts/upload-release-assets.test.mjs

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false' || needs.changes.outputs.quality != 'false' || needs.changes.outputs.relay != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: node scripts/npm-retry.mjs ci

      # Explicit status checks keep independent domains running after a failure.
      # A failed step still fails quality; no continue-on-error or success shim.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
        run: npm run format:check

      - name: Lint lockfile
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm audit signatures

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm run lint

      - name: Test lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: node --test scripts/oxlint/clisbot-plugin.test.mjs

      - name: Build relay
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run build:relay

      - name: Run relay tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run test --workspace=@clisbot/relay

      - name: Build client dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:relay && npm run build:client

      - name: Build plugin SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:plugin

      - name: Run plugin SDK tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@clisbot/plugin

      - name: Run protocol tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@clisbot/protocol

      - name: Run client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@clisbot/client

      - name: Run device authority tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@clisbot/device-access -- --maxWorkers=1 --bail=1

      - name: Run highlight tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@clisbot/highlight

      - name: Typecheck client examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run typecheck:examples --workspace=@clisbot/client

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify dependency patch recovery
        run: node --test scripts/postinstall-patches.test.mjs

      - name: Build server stack
        run: npm run build:server

      # The Hub and the channel packages typecheck against the channel packages' built output.
      - name: Build channel packages
        run: npm run build:channels

      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Run Hub PostgreSQL runtime tests
        working-directory: packages/hub
        run: npx vitest run src/db/runtime/internal/postgres.test.ts --bail=1

      - name: Run website tests
        run: npx vitest run packages/website/src --bail=1

      - name: Install website test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify website mockups
        run: npm run test:e2e --workspace=@clisbot/website

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@clisbot/protocol
          npm pack --dry-run --ignore-scripts --workspace=@clisbot/device-access
          npm pack --dry-run --ignore-scripts --workspace=@clisbot/client
          npm pack --dry-run --ignore-scripts --workspace=@clisbot/server

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - &server_capacity
        name: Log runner capacity
        run: |
          node -e "const os = require('node:os'); console.log(JSON.stringify({cpus: os.cpus().length, model: os.cpus()[0].model, ramGiB: os.totalmem() / 2 ** 30}))"

      - &server_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &server_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - &server_fetch
        name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - &server_install
        name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - &server_agent_clis
        name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - &server_build
        name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@clisbot/server

      - &server_plugin_tests
        name: Run built-in plugin tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@clisbot/builtin-plugins

      - &server_hub_contract
        name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@clisbot/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server unit tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test:unit --workspace=@clisbot/server

      - *server_plugin_tests
      - *server_hub_contract

  # Keep the serial integration chain off the Windows unit critical path.
  server-integration-windows:
    name: server-integration (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server integration tests
        run: npm run test:integration --workspace=@clisbot/server

  # native-recursive.ts serves darwin and win32, but windows-latest above is the only
  # runner that exercises it. macOS — the platform the reported watcher bug was on —
  # otherwise has no server-test coverage. Scoped to the observer/watcher suites to
  # bound runtime.
  server-tests-macos:
    name: server-tests (macos-14, file observation)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@clisbot/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    # Includes backend/UI builds, installed-artifact smoke, Electron lifecycle,
    # renderer tests and browser tabs; keep their individual timeouts bounded.
    timeout-minutes: 45
    permissions:
      contents: read
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build desktop backends
        run: npm run build:desktop-backends

      - name: Build shared daemon web UI for packaged serving
        run: npm run build:daemon-web-ui

      - name: Run desktop tests
        run: npm run test --workspace=@clisbot/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool dbus-x11 gnome-keyring libsecret-1-0

      - name: Verify optional Hub and independent service lifecycle
        run: npm run test:e2e:personal-serving --workspace=@clisbot/cli

      - name: Verify installed npm artifact serving
        run: npm run test:e2e:packaged-serving --workspace=@clisbot/cli

      - name: Verify Electron personal onboarding (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a node packages/desktop/e2e/linux-secret-service.mjs -- npm run test:e2e:personal-serving --workspace=@clisbot/desktop

      - name: Verify Electron personal onboarding (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:personal-serving --workspace=@clisbot/desktop

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Verify Windows daemon process control
        if: ${{ runner.os == 'Windows' }}
        run: npx vitest run packages/cli/src/commands/daemon/lifecycle.e2e.test.ts --bail=1 --maxWorkers=1 -t "Windows unbound|managed two-home"

      - name: Run desktop lifecycle E2E (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:e2e:lifecycle --workspace=@clisbot/desktop
        env:
          CLISBOT_DESKTOP_LIFECYCLE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-lifecycle

      - name: Upload desktop lifecycle screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: desktop-lifecycle
          path: ${{ runner.temp }}/desktop-lifecycle
          if-no-files-found: ignore
          retention-days: 7

      - name: Run desktop lifecycle E2E (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:lifecycle --workspace=@clisbot/desktop

      - name: Run desktop renderer E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:renderer --workspace=@clisbot/desktop

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:browser-tabs --workspace=@clisbot/desktop
        env:
          CLISBOT_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      - name: Upload desktop browser diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *desktop_test_steps

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@clisbot/app

      - name: Verify managed Google handoff destinations
        run: node --test packages/app/scripts/hub-google-auth-page.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Android module tests
        run: npm run test:android --workspace=@clisbot/app

  playwright-1:
    name: playwright (shard 1/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "1/8"
      PLAYWRIGHT_ARTIFACT: "1"
    steps: &playwright_test_steps
      - name: Log runner capacity
        run: |
          node -e "const os = require('node:os'); console.log(JSON.stringify({cpus: os.cpus().length, model: os.cpus()[0].model, ramGiB: os.totalmem() / 2 ** 30}))"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build server stack
        run: npm run build:server

      - name: Build native app dependency
        run: npm run build --workspace=@clisbot/expo-two-way-audio

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=@clisbot/app -- --shard=${{ env.PLAYWRIGHT_SHARD }} --reporter=list,github
        env:
          E2E_WORKERS: "2"
          # File groups are weighted by observed reporter durations.
          # Share of the test list per shard, rebalanced from the Playwright step
          # minutes of five eight-shard runs so the slowest and fastest shards meet.
          PWTEST_SHARD_WEIGHTS: "85:94:117:128:91:103:127:85"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ env.PLAYWRIGHT_ARTIFACT }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  playwright-2:
    name: playwright (shard 2/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "2/8"
      PLAYWRIGHT_ARTIFACT: "2"
    steps: *playwright_test_steps

  playwright-3:
    name: playwright (shard 3/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "3/8"
      PLAYWRIGHT_ARTIFACT: "3"
    steps: *playwright_test_steps

  playwright-4:
    name: playwright (shard 4/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "4/8"
      PLAYWRIGHT_ARTIFACT: "4"
    steps: *playwright_test_steps

  playwright-5:
    name: playwright (shard 5/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "5/8"
      PLAYWRIGHT_ARTIFACT: "5"
    steps: *playwright_test_steps

  playwright-6:
    name: playwright (shard 6/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "6/8"
      PLAYWRIGHT_ARTIFACT: "6"
    steps: *playwright_test_steps

  playwright-7:
    name: playwright (shard 7/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "7/8"
      PLAYWRIGHT_ARTIFACT: "7"
    steps: *playwright_test_steps

  playwright-8:
    name: playwright (shard 8/8)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "8/8"
      PLAYWRIGHT_ARTIFACT: "8"
    steps: *playwright_test_steps

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      CLISBOT_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      CLISBOT_DICTATION_ENABLED: "0"
      CLISBOT_VOICE_MODE_ENABLED: "0"
      CLISBOT_CLI_TEST_SHARD: "1"
      CLISBOT_CLI_TEST_SHARD_TOTAL: "3"
    steps: &cli_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      # The local runner builds its dependencies and shards its own E2E files.
      - name: Run CLI E2E tests
        run: npm run test:local --workspace=@clisbot/cli

      # Source tests do not read CLISBOT_CLI_TEST_SHARD. Run them once, on the
      # shortest E2E shard, after its runner has built the server stack.
      - name: Run CLI source tests
        if: ${{ env.CLISBOT_CLI_TEST_SHARD == '3' }}
        run: npm run test:unit --workspace=@clisbot/cli

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      CLISBOT_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      CLISBOT_DICTATION_ENABLED: "0"
      CLISBOT_VOICE_MODE_ENABLED: "0"
      CLISBOT_CLI_TEST_SHARD: "2"
      CLISBOT_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      CLISBOT_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      CLISBOT_DICTATION_ENABLED: "0"
      CLISBOT_VOICE_MODE_ENABLED: "0"
      CLISBOT_CLI_TEST_SHARD: "3"
      CLISBOT_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps
