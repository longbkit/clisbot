name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Clisbot $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

  publish-android-apk:
    needs: [ensure-release]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free runner disk space
        shell: bash
        run: |
          # A four-ABI release build needs more than the runner's default free space.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The Expo account has no paid plan, and production-apk needs the `large` cloud resource
      # class, so the APK is built on this runner. EAS still supplies the remote signing keystore.
      - name: Build Android APK locally
        id: artifact
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_SERVICE_INFO_PLIST_PROD_CONTENT: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          LEFTHOOK: "0"
        run: |
          set -euo pipefail
          # EAS archives the project by .gitignore, so the Firebase files are passed by absolute path.
          if [[ -n "${GOOGLE_SERVICES_JSON_PROD:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_PROD" > "$RUNNER_TEMP/google-services.prod.json"
            export GOOGLE_SERVICES_FILE_PROD="$RUNNER_TEMP/google-services.prod.json"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_PROD is not set; the APK ships without product analytics."
          fi
          if [[ -n "${GOOGLE_SERVICE_INFO_PLIST_PROD_CONTENT:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_PROD_CONTENT" > "$RUNNER_TEMP/GoogleService-Info.prod.plist"
            export GOOGLE_SERVICE_INFO_PLIST_PROD="$RUNNER_TEMP/GoogleService-Info.prod.plist"
          fi
          unset GOOGLE_SERVICES_JSON_PROD GOOGLE_SERVICE_INFO_PLIST_PROD_CONTENT

          asset_name="clisbot-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          cd packages/app
          npx eas build --local --platform android --profile production-apk --non-interactive \
            --output "$asset_path"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
