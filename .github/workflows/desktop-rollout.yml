name: Desktop Rollout

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      rollout_hours:
        required: true
        type: string

concurrency:
  group: desktop-rollout-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote-verified-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      ROLLOUT_HOURS: ${{ inputs.rollout_hours }}
      RELEASE_SHA: cb93946a0ff259fcfd3ebf492330848f0340c652
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb93946a0ff259fcfd3ebf492330848f0340c652
          fetch-depth: 0
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release source, CI, desktop builds and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v2.0.0
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          for (const id of [38039128388, 38039130335]) {
            const run = JSON.parse(execFileSync('gh', ['api', `repos/longbkit/clisbot/actions/runs/${id}`]));
            assert.equal(run.head_sha, process.env.RELEASE_SHA);
            assert.equal(run.conclusion, 'success');
          }
          const tags = JSON.parse(execFileSync('npm', ['view', 'clisbot', 'dist-tags', '--json']));
          assert.equal(tags.latest, '2.0.0');
          assert.equal(tags.beta, '2.0.0');
          JS
      - uses: actions/download-artifact@v4
        with:
          run-id: 38039130335
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: desktop-*
          path: prebuilt
      - name: Install manifest parser
        run: |
          npm install --prefix "$RUNNER_TEMP/manifest-tools" --ignore-scripts --no-audit --no-fund js-yaml@4.1.1
          ln -s "$RUNNER_TEMP/manifest-tools/node_modules" node_modules
      - name: Verify binary hashes and assemble updater manifests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {load} from 'js-yaml';
          for (const [platform, name] of [['macos-arm64','latest-mac.yml'],['macos-x64','latest-mac.yml'],['linux','latest-linux.yml'],['windows','latest.yml']]) {
            const directory = `prebuilt/desktop-${platform}`;
            const manifest = load(fs.readFileSync(`${directory}/${name}`, 'utf8'));
            assert.equal(manifest.version, '2.0.0');
            assert.ok(manifest.files.length > 0);
            for (const file of manifest.files) {
              const filename = decodeURIComponent(file.url);
              assert.equal(path.basename(filename), filename);
              const target = path.join(directory, filename);
              const hash = createHash('sha512');
              for await (const chunk of fs.createReadStream(target)) hash.update(chunk);
              assert.equal(hash.digest('base64'), file.sha512, filename);
              if (file.size !== undefined) assert.equal(fs.statSync(target).size, file.size);
            }
            for (const entry of fs.readdirSync(directory, {withFileTypes:true})) {
              if (entry.isFile() && !entry.name.startsWith('Clisbot') && !entry.name.endsWith('.yml')) fs.unlinkSync(path.join(directory,entry.name));
            }
          }
          JS
          mkdir final-manifests
          node scripts/merge-mac-manifest.mjs prebuilt/desktop-macos-arm64/latest-mac.yml prebuilt/desktop-macos-x64/latest-mac.yml final-manifests/latest-mac.yml
          cp prebuilt/desktop-linux/latest-linux.yml prebuilt/desktop-windows/latest.yml final-manifests/
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          node scripts/stamp-rollout.mjs --release-date "$timestamp" --rollout-hours "$ROLLOUT_HOURS" final-manifests/*.yml
          node scripts/validate-desktop-manifests.mjs --release-date "$timestamp" --rollout-hours "$ROLLOUT_HOURS" final-manifests/*.yml
      - name: Publish verified desktop assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-release-notes-from-changelog.mjs --repo longbkit/clisbot --tag "$RELEASE_TAG" --create-if-missing
          release_lookup="$(node scripts/github-release.mjs --repo longbkit/clisbot --tag "$RELEASE_TAG")"
          for platform in macos-arm64 macos-x64 linux windows; do
            node scripts/upload-release-assets.mjs "$release_lookup" "prebuilt/desktop-$platform" longbkit/clisbot
          done
          gh release upload "$release_lookup" final-manifests/*.yml --clobber --repo longbkit/clisbot
          gh release edit "$release_lookup" --tag "$RELEASE_TAG" --draft=false --latest --repo longbkit/clisbot
