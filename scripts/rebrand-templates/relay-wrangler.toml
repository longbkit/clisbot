# Cloudflare Worker deployment option. The official relay currently uses Docker + Tunnel.
name = "clisbot-relay-worker"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

workers_dev = false
preview_urls = false

[observability]
enabled = true

[vars]
# Set an HTTPS origin when the Worker should proxy to an upstream relay, such as Fly.
CLISBOT_RELAY_UPSTREAM = ""

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
