  font-weight: 600;
}
.setup-h p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.setup-steps {
  border-top: 1px solid var(--border-subtle);
}
.step {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.step:last-child {
  border-bottom: 0;
}
.step .n {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--border-accent);
  display: grid;
  place-items: center;
  font-size: 11px;
  color: var(--muted);
  flex: none;
}
.step.done .n {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.step.now .n {
  border-color: var(--fg);
  color: var(--fg);
  font-weight: 600;
}
.step .st {
  font-weight: 500;
}
.step .sd {
  font-size: 12px;
  color: var(--quiet);
  margin-top: 1px;
}
.step .sa {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.setup-foot {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 16px;
  background: var(--s1);
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--quiet);
  flex-wrap: wrap;
}
.cmd {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--s1);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
}
.cmd span {
  flex: 1;
}

/* ---------- Session rows ---------- */
.rows {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg);
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  text-align: left;
}
.row:last-child {
  border-bottom: 0;
}
.row:hover {
  background: var(--s1);
}
.row .ri {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: var(--s2);
  display: grid;
  place-items: center;
  flex: none;
  color: var(--muted);
}
.row .ri .pv {
  width: 15px;
  height: 15px;
}
.row .rt {
  font-weight: 500;
}
.row .rm {
  font-size: 12px;
  color: var(--quiet);
}
.row .rr {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex: none;
  font-size: 12px;
  color: var(--quiet);
}
.row.new {
  animation: flash 1.6s ease-out;
}
@keyframes flash {
  from {
    background: var(--ok-tint);
  }
  to {
    background: transparent;
  }
}
.empty {
  padding: 18px;
  text-align: center;
  color: var(--quiet);
  font-size: 13px;
  border: 1px dashed var(--border-accent);
  border-radius: 10px;
}

/* ---------- Popover / sheet / toast ---------- */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 30;
}
.scrim.dim {
  background: #0000003d;
}
.pop {
  position: absolute;
  z-index: 31;
  width: 320px;
  max-height: 420px;
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--pop);
  padding: 6px;
}
.dark .pop {
  background: var(--s1);
}
.pop-h {
  padding: 6px 8px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--quiet);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  text-align: left;
}
.opt:hover:not(:disabled) {
  background: var(--s2);
}
.opt:disabled {
  opacity: 0.55;
}
.opt .od {
  font-size: 12px;
  color: var(--quiet);
}
.opt .check {
  margin-left: auto;
  color: var(--accent-bright);
}
.pop hr {
  border: 0;
  border-top: 1px solid var(--border-subtle);
  margin: 4px 0;
}
.sheet {
  position: absolute;
  z-index: 32;
  right: 0;
  top: 0;
  bottom: 0;
  width: 440px;
  max-width: 100%;
  background: var(--bg);
  border-left: 1px solid var(--border);
  box-shadow: var(--pop);
  display: flex;
  flex-direction: column;
}
.mobile .sheet,
.mobile .pop {
  left: 0;
  right: 0;
  top: auto;
  bottom: 0;
  width: auto;
  max-height: 82%;
  border-radius: 16px 16px 0 0;
  border: 0;
}
.mobile .pop {
  padding: 10px 8px 22px;
}
.mobile .pop .opt {
  min-height: 44px;
}
.sheet-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.sheet-h h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.sheet-b {
  flex: 1;
  overflow: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sheet-f {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 12px 16px;
  border-top: 1px solid var(--border-subtle);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.field input {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
}
.qr {
  width: 168px;
  height: 168px;
  margin: 4px auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  background:
    repeating-linear-gradient(0deg, transparent 0 10px, #0000000a 10px 11px),
    repeating-linear-gradient(90deg, transparent 0 10px, #0000000a 10px 11px);
  color: var(--muted);
}
.kv {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px 12px;
  font-size: 13px;
}
.kv dt {
  color: var(--quiet);
}
.kv dd {
  margin: 0;
}
.toast {
  position: absolute;
  z-index: 40;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 14px;
  background: var(--primary);
  color: var(--primary-fg);
  border-radius: 9px;
  box-shadow: var(--pop);
  font-size: 13px;
  max-width: calc(100% - 24px);
}
.toast .link {
  color: inherit;
  text-decoration: underline;
}
.mobile .toast {
  bottom: 96px;
}

/* ---------- Design notes drawer ---------- */
.notes {
  width: 380px;
  flex: none;
  height: calc(100vh - 110px);
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  font-size: 13px;
}
.notes h2 {
  font-size: 16px;
  margin: 0 0 6px;
}
.notes h3 {
  font-size: 13px;
  margin: 16px 0 6px;
}
.notes p,
.notes li {
  color: var(--muted);
}
.notes ul {
  padding-left: 18px;
  margin: 6px 0;
}
.notes table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.notes td,
.notes th {
  border-bottom: 1px solid var(--border-subtle);
  padding: 5px 4px;
  text-align: left;
  vertical-align: top;
}
.notes th {
  color: var(--quiet);
  font-weight: 500;
}
@media (max-width: 1100px) {
  .notes {
    position: fixed;
    right: 10px;
    top: 120px;
    z-index: 60;
    box-shadow: var(--pop);
    max-width: calc(100vw - 20px);
  }
}
@media (max-width: 760px) {
  .stage {
    padding: 0;
  }
  .frame,
  .frame.mobile {
    border: 0;
    border-radius: 0;
    height: calc(100vh - 140px);
    width: 100%;
    max-width: none;
    box-shadow: none;
  }
}

}
.c6-pi {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--s3);
  color: var(--muted);
  font-size: 10px;
  display: inline-grid;
  place-items: center;
  flex: none;
}
.c6-why {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 18px;
  padding: 0 8px;
  font-size: 12px;
  color: var(--quiet);
}
.c6-try {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.c6-try.scroll {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.c6-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.c6-pill:hover {
  background: var(--s1);
  color: var(--fg);
}
.c6-pill.ghost {
  border-style: dashed;
}
.c6-sep {
  width: 1px;
  height: 18px;
  background: var(--border);
  margin: 0 4px;
}
.c6-over {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 26px;
  align-items: start;
}
.c6-over.one {
  grid-template-columns: minmax(0, 640px);
  justify-content: center;
}
.c6-col {
  display: flex;
  flex-direction: column;
  gap: 26px;
  min-width: 0;
}
.c6-dock {
  flex: none;
  padding: 6px 10px 8px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.c6-dock .c6-row {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.c6-dock .c6-row .grow {
  display: none;
}
.c6-dock .c6-chip {
  font-size: 13px;
  min-height: 32px;
}
.c6-dock .composer {
  border-radius: 18px;
}
.mobile .c6 {
  padding: 12px 12px 20px;
  gap: 20px;
}
@media (max-width: 1100px) {
  .c6-over {
    grid-template-columns: 1fr;
  }
}
/* Hosts strip: a status line, not a card */
.c6-hosts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.c6-hosts-h {
  display: flex;
  align-items: center;
  gap: 8px;
}
.c6-hosts-label {
  font-size: 13px;
  font-weight: 600;
}
.c6-hosts-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.mobile .c6-hosts-list {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.c6-h {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 5px 10px 5px 6px;
  text-align: left;
  flex: none;
  max-width: 220px;
}
.c6-h:hover {
  background: var(--s2);
}
.c6-h-ic {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--s2);
  display: grid;
  place-items: center;
  color: var(--muted);
  flex: none;
}
.c6-h-ic .dot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 9px;
  height: 9px;
  border: 2px solid var(--bg);
  box-sizing: content-box;
}
.c6-h-ic .dot.off {
  background: var(--s3);
  border-color: var(--bg);
}
.c6-h-t {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.25;
  font-size: 13px;
}
.c6-h-s {
  font-size: 11px;
  color: var(--quiet);
}
.c6-h.off .c6-h-t > .ell {
  color: var(--muted);
}
.c6-h.warn .c6-h-s {
  color: var(--warn);
}
.c6-connection-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 8px;
  background: transparent;
  border: 0;
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
  text-align: left;
}
.c6-connection-summary:hover {
  background: var(--s2);
}
.c6-connection-summary > .icon {
  flex: none;
  color: var(--warn);
}
.c6-connection-summary > span:not(.icon) {
  min-width: 0;
}
.c6-connection-link {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  white-space: nowrap;
  flex: none;
}
.mobile .c6-connection-summary {
  font-size: 11px;
  gap: 6px;
  padding-inline: 4px;
}
/* Under the composer: host brief + Import session */
.c6-under {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  min-height: 26px;
}
.c6-under > .grow {
  flex: 1 0 0;
}
.c6-under > .c6-pill {
  margin-left: auto;
}
.c6-brief {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex-wrap: nowrap;
  white-space: nowrap;
  padding: 0 4px;
  font-size: 12px;
  color: var(--muted);
}
.c6-brief.warn .c6-brief-n {
  color: var(--warn);
}
.c6-pvs {
  display: inline-flex;
  gap: 2px;
}
.c6-pv {
  position: relative;
  width: 24px;
  height: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  display: grid;
  place-items: center;
  padding: 0;
}
.c6-pv .pv {
  width: 13px;
  height: 13px;
}
.c6-pv.signin,
.c6-pv.missing {
  color: var(--quiet);
  border-style: dashed;
}
.c6-pv.signin .pv,
.c6-pv.missing .pv {
  opacity: 0.55;
}
.c6-pv-badge {
  position: absolute;
  right: -4px;
  top: -4px;
  min-width: 12px;
  height: 12px;
  border-radius: 6px;
  font-size: 9px;
  line-height: 12px;
  font-weight: 700;
  color: #fff;
  background: var(--dot-warn);
}
.c6-pv.missing .c6-pv-badge {
  background: var(--quiet);
}
.c6-brief-n {
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 2px 4px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--muted);
}
.c6-brief-n b {
  color: var(--fg);
  font-weight: 600;
}
.c6-brief-more:hover {
  background: var(--s2);
}
.c6-brief-more {
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 2px 4px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--accent-bright);
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.c6-brief.compact {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 6px 2px;
}
/* Quick start */
.c6-quick-wrap {
  width: 100%;
  max-width: 788px;
  margin: -8px auto 0;
}
.c6-qgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.c6-qgrid.one {
  grid-template-columns: 1fr;
}
.c6-q {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 10px;
  padding: 8px 10px;
  text-align: left;
  min-width: 0;
}
.c6-q:hover {
  background: var(--s1);
}
.c6-q-t {
  display: flex;
  flex-direction: column;
  min-width: 0;
  font-size: 13px;
  line-height: 1.3;
}
.c6-q-s {
  font-size: 11px;
  color: var(--quiet);
}
.c6-av {
  width: 28px;
  height: 28px;
  flex: none;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 600;
}
.c6-av.bot {
  border-radius: 50%;
  color: #fff;
}
.c6-av.proj {
  border-radius: 7px;
  background: var(--s3);
  color: var(--muted);
}
.c6-av.icon {
  border-radius: 7px;
  background: var(--s2);
  color: var(--muted);
}
.c6-chip .c6-av,
.opt .c6-av {
  width: 20px;
  height: 20px;
  font-size: 9px;
}
.c6-chip .c6-av.proj {
  border-radius: 5px;
}
.mobile .c6-hosts {
  padding-bottom: 10px;
}
.mobile .c6-h {
  flex-direction: column;
  gap: 4px;
  width: 72px;
  padding: 6px 2px;
  text-align: center;
}
.mobile .c6-h-ic {
  width: 40px;
  height: 40px;
}
.mobile .c6-h-t {
  align-items: center;
  width: 100%;
}
.mobile .c6-h-t > .ell {
  max-width: 100%;
  font-size: 12px;
}
.mobile .c6-qgrid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.mobile .c6-qgrid.one {
  grid-template-columns: 1fr;
}

/* 06 uses centered task dialogs, matching the app's modal system. */
.sheet,
.mobile .sheet {
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 32px));
  max-width: none;
  max-height: calc(100% - 48px);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}
.sheet-b {
  min-height: 0;
}
.sheet-h,
.sheet-f {
  flex-shrink: 0;
}
.c6-start-heading {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 12px;
}
.c6-start h1,
.c6-start-heading h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 400;
}
.c6-start-choices {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.c6-start-choice {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: var(--bg);
}
.c6-start-choice:hover {
  background: var(--s1);
}
.c6-start-choice.on {
  color: var(--fg);
  background: var(--s2);
  border-color: var(--border-accent);
}
.c6-brief-more {
  color: var(--fg);
  background: var(--s2);
  padding: 5px 8px;
  margin-left: 4px;
}
.c6-over {
  width: 100%;
  max-width: 788px;
  margin: 4px auto 0;
  padding-top: 24px;
  border-top: 1px solid var(--border-subtle);
  gap: 24px;
}
.c6-quick .sec-h h2 {
  color: var(--muted);
}
.c6-quick .c6-q {
  border-color: var(--border-subtle);
}
.c6-actions-modal .sheet-b > section + section {
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
}
.mobile .c6-start-heading {
  gap: 12px;
  margin: 0;
}
.mobile .c6-start-heading h1 {
  font-size: 18px;
}
.mobile .c6-start-choices {
  gap: 6px;
}
.mobile .c6-start-choice {
  font-size: 12px;
  min-height: 36px;
  padding: 6px 8px;
  gap: 5px;
}
.mobile .c6-brief {
  flex-wrap: wrap;
  gap: 4px;
}
.mobile .c6-brief-more {
  margin-left: auto;
}
.mobile .c6-over {
  grid-template-columns: minmax(0, 1fr);
  padding-top: 16px;
}
/* Let the review toolbar take its actual height on a narrow browser. */
@media (max-width: 760px) {
  #root {
    height: var(--c6-viewport-height, 100dvh);
    display: flex;
    flex-direction: column;
  }
  .review {
    flex-shrink: 0;
  }
  .stage {
    flex: 1;
    min-height: 0;
  }
  .frame,
  .frame.mobile {
    height: auto;
    min-height: 0;
  }
}

/* The same three entry choices, with equal cells on a phone. */
.c6-start-choices {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.c6-start-choice {
  min-width: 0;
}
.c6-chip > .ell {
  min-width: 0;
}
.c6-provider-summary {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.c6-pv {
  cursor: default;
  border: 0;
  background: transparent;
  width: 18px;
  height: 18px;
}
.c6-brief-n {
  padding: 0;
  cursor: default;
}
.c6-brief-n b {
  font-weight: 400;
}
.c6-pvs {
  gap: 2px;
}
.c6-q {
  min-height: 68px;
  padding: 10px 12px;
}
.c6-q-title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.c6-q-t {
  gap: 3px;
}
.c6-q-s {
  font-size: 12px;
}
.c6-empty-pins {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  width: 100%;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: transparent;
}

/* One quiet row shape for the entire overview. Actions live in the detail dialog. */
.c6-over {
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
}
.c6-over > section {
  min-width: 0;
}
.c6-feed {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.c6-feed-row {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 108px 14px;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 12px;
  border: 0;
  background: transparent;
  text-align: left;
}
.c6-feed-row + .c6-feed-row {
  border-top: 1px solid var(--border-subtle);
}
.c6-feed-row:hover {
  background: var(--s1);
}
.c6-feed-text,
.c6-feed-trail {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.c6-feed-sub,
.c6-feed-time {
  font-size: 12px;
  color: var(--quiet);
}
.c6-feed-trail {
  text-align: right;
  font-size: 12px;
}
.c6-feed-status {
  color: var(--muted);
}
.c6-feed-status.attention {
  color: var(--warn);
}
.c6-feed-status.failed {
  color: var(--danger);
}
.c6-feed-row > .icon {
  color: var(--quiet);
}
.c6-attention-count {
  font-size: 12px;
  color: var(--quiet);
}

/* Library: use a row, edit it, or pin it. Every saved target supplies its own avatar. */
.c6-actions-modal {
  width: min(660px, calc(100% - 32px));
}
.c6-library-toolbar {
  flex-shrink: 0;
  padding: 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.c6-library-toolbar p {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
}
.c6-library-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.c6-search {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--quiet);
}
.c6-search input {
  border: 0;
  background: transparent;
  outline: none;
  min-width: 0;
  width: 100%;
  padding: 0;
  font-size: 13px;
}
.c6-search:focus-within {
  border-color: var(--border-accent);
  box-shadow: 0 0 0 1px var(--border-accent);
}
.c6-library-controls .c6-search {
  flex: 1;
}
.c6-library-controls > .btn {
  flex-shrink: 0;
}
.c6-library-list {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.c6-library-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 10px;
}
.c6-library-row + .c6-library-row {
  border-top: 1px solid var(--border-subtle);
}
.c6-library-use {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  min-height: 64px;
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  text-align: left;
}
.c6-library-use:hover {
  background: var(--s1);
}
.c6-library-title,
.c6-library-sub {
  display: block;
}
.c6-library-title {
  font-size: 13px;
}
.c6-library-sub {
  font-size: 12px;
  color: var(--quiet);
  margin-top: 3px;
}
.c6-use-label {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 12px;
  color: var(--quiet);
}
.c6-pin {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-width: 74px;
  min-height: 32px;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  font-size: 12px;
  background: transparent;
  color: var(--quiet);
}
.c6-pin:hover {
  background: var(--s2);
}
.c6-pin.on {
  color: var(--fg);
  background: var(--s2);
}
.c6-actions-modal .sheet-b > section + section {
  padding-top: 4px;
  border-top: 0;
}
.c6-back {
  transform: rotate(180deg);
}
.c6-quick-form .sheet-b {
  gap: 20px;
}
.c6-quick-form input:not([type="checkbox"]),
.c6-quick-form textarea {
  width: 100%;
}
.c6-quick-form textarea {
  resize: vertical;
  min-height: 96px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--bg);
}
.c6-select-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  min-height: 44px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
}
.c6-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.c6-checkbox input {
  accent-color: var(--accent);
}

/* Combobox contract: search header, grouped scrollable options, persistent add actions. */
.pop:has(.c6-target-picker) {
  width: min(400px, calc(100% - 16px));
  padding: 0;
  overflow: hidden;
  max-height: none;
}
.c6-target-picker {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.c6-target-picker > .c6-search {
  flex-shrink: 0;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  border-radius: 0;
  padding: 12px;
}
.c6-target-options {
  max-height: 260px;
  overflow: auto;
  padding: 4px;
}
.c6-target-options .opt {
  min-height: 44px;
}
.c6-target-options .opt.active {
  background: var(--s2);
}
.c6-option-name,
.c6-option-desc {
  display: block;
}
.c6-picker-footer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 4px;
  border-top: 1px solid var(--border-subtle);
}
.c6-inline-picker {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.c6-inline-picker .c6-target-options {
  max-height: 184px;
}

.mobile .c6-start-choices {
  gap: 6px;
}
.mobile .c6-start-choice {
  flex-direction: column;
  gap: 5px;
  min-height: 56px;
  font-size: 12px;
  padding: 8px 3px;
  white-space: nowrap;
}
.mobile .c6-dock {
  padding: 8px;
  gap: 8px;
}
.mobile .c6-dock .c6-row {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
  overflow: visible;
  gap: 2px 6px;
}
.mobile .c6-dock .c6-chip {
  min-width: 0;
  width: 100%;
  padding: 4px;
  gap: 5px;
}
.mobile .c6-dock .c6-chip > .icon:last-child {
  margin-left: auto;
}
.mobile .c6-desktop-label {
  display: none;
}
.mobile .c6-brief {
  display: flex;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 6px;
  padding: 0 4px;
  overflow: visible;
}
.mobile .c6-provider-summary {
  gap: 5px;
}
.mobile .c6-pv {
  width: 12px;
  height: 16px;
}

    .filter(H.online)
    .sort((a, b) => H.isLocal(b) - H.isLocal(a) || (a.usedAgo ?? 1e9) - (b.usedAgo ?? 1e9));

  <div class="ctx-line">${opts.label ? `<span class="quiet small">${opts.label}</span>` : ""}
    ${U.hostChip(ctx)}<span class="ctx-sep">›</span>${U.projectChip(ctx)}
    ${opts.why === false ? "" : `<span class="quiet small" style="margin-left:4px">${U.why(ctx)}</span>`}
    ${opts.remote === false ? "" : `<button class="btn ghost sm" style="margin-left:auto" data-a="sheet" data-sheet="pair">${I("plus", "sm")} Connect a computer</button>`}
  </div>`;

// ---------- Composer ----------
U.targetChip = (ctx) => {
  const t = ctx.target;
  if (t.kind === "bot") {
    const b = H.bot(t.botId);
    return `<button class="c-chip" data-a="pop" data-pop="target" data-anchor="target"><span class="badge pill" style="padding:0 5px">${E(b.initials)}</span>${E(b.name)}${I("down", "sm")}</button>`;
  }
  const p = H.providers[t.provider];
  const label = t.kind === "starter" ? `${p.name} · ${p.model}` : `${p.model}`;
  return `<button class="c-chip" data-a="pop" data-pop="target" data-anchor="target" title="${E(p.name)}">${H.pv(t.provider)}${E(label)}${I("down", "sm")}</button>`;
};
U.composer = (ctx, opts = {}) => {
  const S = H.S;
  const blocked = !ctx.canSend;
  const ph =
    opts.placeholder ||
    (H.compact
      ? ctx.target.kind === "bot"
        ? `Message ${H.bot(ctx.target.botId).name}…`
        : "Message…"
      : ctx.target.kind === "bot"
        ? `Message ${H.bot(ctx.target.botId).name}…`
        : ctx.target.kind === "starter"
          ? "Ask anything, or describe what you want to build…"
          : "Message the agent, tag @files, or use /commands and /skills");
  return `<div class="composer ${blocked ? "blocked" : ""}">
    <textarea id="draft" rows="${opts.rows || 2}" placeholder="${E(ph)}" aria-label="Message">${E(S.draft)}</textarea>
    <div class="c-bar"><div class="c-chips">
      <button class="c-chip" data-a="attach" title="Attach files">${I("plus")}</button>
      ${opts.ctxInside ? `${U.hostChip(ctx, "c-chip ctx")}${U.projectChip(ctx, "c-chip")}` : ""}
      ${U.targetChip(ctx)}
      ${
        ctx.target.kind === "bot"
          ? ""
          : `<button class="c-chip" data-a="pop" data-pop="thinking" data-anchor="thinking">${I("brain")}${E(S.thinking || "High")}${I("down", "sm")}</button>
      <button class="c-chip" data-a="pop" data-pop="perm" data-anchor="perm">${I("shield")}${E(S.perm || "Default permissions")}${I("down", "sm")}</button>`
      }
      </div>
      <button class="c-chip" data-a="mic" title="Dictate">${I("mic")}</button>
      <button class="c-send" data-a="send" id="send" title="Send (Enter)" ${blocked || !S.draft.trim() ? "disabled" : ""}>${I("up")}</button>
    </div></div>`;
};
U.notice = (ctx) => {
  const n = ctx.notice;
  if (!n)
    return ctx.target.swapped
      ? `<div class="notice info">${I("info")}<div>${E(H.providers[H.S.memory.last?.target?.provider]?.name || "That agent")} isn't ready on ${E(H.hostLabel(ctx.host))}, so this uses ${E(H.providers[ctx.target.provider].name)}.</div></div>`
      : "";
  if (n.kind === "host-offline")
    return `<div class="notice warn">${I("offline")}<div class="grow">
      <b>${E(n.from?.name)} is offline.</b> New messages go to <b>${E(H.hostLabel(n.to))} › ${E(ctx.project?.name || "—")}</b> instead. Your draft is kept; sessions on ${E(n.from?.name)} stay there.
      <div class="acts"><button class="btn sm" data-a="pop" data-pop="host" data-anchor="host">Change</button><button class="btn sm ghost" data-a="reconnect" data-id="${n.from?.id}">${I("refresh", "sm")} Reconnect ${E(n.from?.name)}</button></div></div>
      <button class="x" data-a="dismiss" data-id="host-offline" title="Dismiss">${I("x", "sm")}</button></div>`;
  return `<div class="notice warn">${I("folder")}<div class="grow"><b>${E(n.from)}</b> is no longer on ${E(H.hostLabel(ctx.host))}. New messages go to <b>${E(n.to?.name || "—")}</b>.
      <div class="acts"><button class="btn sm" data-a="pop" data-pop="project" data-anchor="project">Change project</button></div></div>
      <button class="x" data-a="dismiss" data-id="project-gone" title="Dismiss">${I("x", "sm")}</button></div>`;
};

// ---------- Setup: what blocks sending, and the way through ----------
const remoteFoot = (text = "Agents can also run on another computer or server.") =>
  `<div class="setup-foot">${I("server", "sm")}<span class="grow">${text}</span><button class="btn sm" data-a="sheet" data-sheet="pair">Connect a computer</button></div>`;
U.setup = (ctx) => {
  const b = ctx.blocker;
  if (!b) return "";
  const S = H.S;
  if (b.kind === "starting")
    return `<div class="notice info">${I("loader", "spin")}<div class="grow"><b>Starting Clisbot on this Mac…</b> You can type now; send turns on when it's ready.</div></div>`;
  if (b.kind === "probing")
    return `<div class="notice info">${I("loader", "spin")}<div class="grow"><b>Looking for Clisbot on this computer…</b><div class="quiet small">Checking localhost:6767</div></div><button class="btn sm ghost" data-a="sheet" data-sheet="pair">Use another computer</button></div>`;
  if (b.kind === "web-missing")
    return `<div class="setup"><div class="setup-h"><span class="glyph">${I("monitor", "lg")}</span><div><h3>Start Clisbot on this computer</h3><p>The web app talks to Clisbot running on your computer. Your code stays there.</p></div></div>
    <div class="setup-steps">
      <div class="step now"><span class="n">1</span><div class="grow"><div class="st">Open the Clisbot desktop app</div><div class="sd">It starts Clisbot in the background. No terminal needed.</div>
        <div class="sa"><button class="btn sm solid" data-a="open-desktop">${I("external", "sm")} Open Clisbot</button><button class="btn sm ghost" data-a="download">Download</button></div></div></div>
      <div class="step"><span class="n">2</span><div class="grow"><div class="st">Or start it from a terminal</div>
        <div class="sa" style="width:100%"><div class="cmd grow"><span>npm install -g @clisbot/cli && clisbot</span><button class="btn sm ghost" data-a="copy">${I("copy", "sm")}</button></div></div></div></div>
      <div class="step"><span class="n">3</span><div class="grow"><div class="st">Then check again</div><div class="sa"><button class="btn sm" data-a="probe">${I("refresh", "sm")} Look again</button></div></div></div>
    </div>${remoteFoot("Clisbot already runs on another computer or a server?")}</div>`;
  if (b.kind === "web-blocked")
    return `<div class="setup"><div class="setup-h"><span class="glyph">${I("lock", "lg")}</span><div><h3>Your browser blocked this computer</h3><p>Clisbot is running here, but the browser needs your permission to reach it.</p></div></div>
    <div class="setup-steps">
      <div class="step now"><span class="n">1</span><div class="grow"><div class="st">Click the site settings icon in the address bar</div><div class="sd">Set <b>Local network access</b> to <b>Allow</b>.</div></div></div>
      <div class="step"><span class="n">2</span><div class="grow"><div class="st">Check again</div><div class="sa"><button class="btn sm solid" data-a="probe">${I("refresh", "sm")} Look again</button></div></div></div>
    </div>${remoteFoot("Prefer not to? Pair this browser with the computer instead.")}</div>`;
  if (b.kind === "mobile-pair")
    return `<div class="setup"><div class="setup-h"><span class="glyph">${I("monitor", "lg")}</span><div><h3>Connect your computer</h3><p>Agents run on your computer. This phone sends messages and shows what they do.</p></div></div>
    <div class="setup-steps">
      <div class="step"><span class="n">1</span><div class="grow"><div class="st">Open Clisbot on your computer</div><div class="sd">Desktop app, or <code>clisbot</code> on a server.</div></div></div>
      <div class="step"><span class="n">2</span><div class="grow"><div class="st">Settings → your host → Pair Device</div><div class="sd">It shows a QR code and a link.</div></div></div>
      <div class="step now"><span class="n">3</span><div class="grow"><div class="st">Scan it here</div><div class="sa"><button class="btn solid" data-a="sheet" data-sheet="pair" data-method="qr">${I("qr", "sm")} Scan QR code</button><button class="btn" data-a="sheet" data-sheet="pair" data-method="link">${I("link", "sm")} Paste link</button></div></div></div>
    </div><div class="setup-foot">${I("lock", "sm")}<span>End-to-end encrypted. Your code never leaves your computer.</span></div></div>`;
  if (b.kind === "providers") {
    const h = b.host;
    const how = {
      claude: ["Not signed in", "Run <code>claude</code> once in a terminal and sign in"],
      codex: ["Not installed", "<code>npm install -g @openai/codex</code>"],
      opencode: ["Not installed", "See opencode.ai"],
      copilot: ["Not installed", "<code>gh extension install github/gh-copilot</code>"],
    };
    return `<div class="setup"><div class="setup-h"><span class="glyph">${I("terminal", "lg")}</span><div><h3>No agent is ready on ${E(H.hostLabel(h))}</h3><p>Clisbot runs the coding agents you already use. Set one up on this computer, then check again.</p></div></div>
      <div class="setup-steps">${Object.keys(h.providers)
        .slice(0, 3)
        .map(
          (id) =>
            `<div class="step"><span class="n">${H.pv(id)}</span><div class="grow"><div class="st">${H.providers[id].name} <span class="pill warn">${how[id][0]}</span></div><div class="sd">${how[id][1]}</div></div></div>`,
        )
        .join("")}</div>
      <div class="setup-foot"><span class="grow">Your draft is kept.</span><button class="btn sm solid" data-a="providers-check">${I("refresh", "sm")} Check again</button><button class="btn sm" data-a="sheet" data-sheet="pair">Use another computer</button></div></div>`;
  }
  if (b.kind === "all-offline")
    return `<div class="setup"><div class="setup-h"><span class="glyph">${I("offline", "lg")}</span><div><h3>Can't reach your computers</h3><p>Your draft is kept. Reconnect one to send.</p></div></div>
    <div class="setup-steps">${S.hosts
      .map(
        (
          h,
        ) => `<div class="step"><span class="n">${I(H.hostIcon(h), "sm")}</span><div class="grow"><div class="st">${E(H.hostLabel(h))} <span class="quiet small">· ${E(H.hostVia(h))} · last seen ${E(h.lastSeen || "")}</span></div></div>
      ${h.status === "connecting" ? `<span class="pill">${I("loader", "sm spin")} Connecting</span>` : `<button class="btn sm" data-a="reconnect" data-id="${h.id}">${I("refresh", "sm")} Reconnect</button>`}</div>`,
      )
      .join("")}</div>${remoteFoot()}</div>`;
  if (b.kind === "bot-offline")
    return `<div class="notice warn">${I("offline")}<div class="grow"><b>${E(H.bot(ctx.target.botId).name)}</b> runs on ${E(b.host.name)}, which is offline.
    <div class="acts"><button class="btn sm" data-a="reconnect" data-id="${b.host.id}">Reconnect</button><button class="btn sm ghost" data-a="target-agent">Start an agent session instead</button></div></div></div>`;
  if (b.kind === "no-project")
    return `<div class="notice info">${I("folder")}<div class="grow">Agent sessions work in a project folder on ${E(H.hostLabel(b.host))}.
    <div class="acts"><button class="btn sm solid" data-a="pop" data-pop="project" data-anchor="project">Choose project</button><button class="btn sm" data-a="sheet" data-sheet="add-project">Add a project</button></div></div></div>`;
  return "";
};
U.starterHint = (ctx) =>
  ctx.target.kind === "starter" && ctx.canSend
    ? `<div class="c-hint">${I("spark")}<span>Your first message creates <b style="color:var(--fg);font-weight:500">Personal assistant</b>, a bot with its own folder on ${E(H.hostLabel(ctx.host))} · ${E(H.providers[ctx.target.provider].name)} · Default permissions.</span> <button class="link" data-a="pop" data-pop="project" data-anchor="project">Work in a project instead</button></div>`
    : "";

// ---------- Sidebar and header (current product layout) ----------
U.sidebar = () => {
  const S = H.S;
  const projects = S.projects.filter((p) => !p.botHome && !p.scratch);
  return `<aside class="sidebar">
    <div class="sb-brand">${H.logo}Clisbot</div>
    <div class="sb-nav">
      ${[
        ["plus", "New workspace"],
        ["history", "History"],
        ["automation", "Automations"],
        ["grid", "Connectors"],
      ]
        .map(([i, t]) => `<button class="sb-item" data-a="nav" data-id="${t}">${I(i)}${t}</button>`)
        .join("")}
    </div>
    <div class="sb-scroll">
      <div class="sb-head">${I("bot")}Bots<button class="sb-act" data-a="nav" data-id="Create bot">${I("plus", "sm")}</button></div>
      ${
        S.bots.length
          ? S.bots
              .map(
                (b) =>
                  `<button class="sb-row" data-a="pick-bot" data-id="${b.id}"><span class="badge">${E(b.initials)}</span><span class="ell">${E(b.name)}</span></button>`,
              )
              .join("")
          : '<div class="sb-empty"><b style="color:var(--fg)">No bots yet</b><br>Your first message on Home creates one.</div>'
      }
      <div class="sb-head">${I("grid")}Projects<button class="sb-act" data-a="sheet" data-sheet="add-project">${I("plus", "sm")}</button></div>
      ${
        projects.length
          ? projects
              .map((p) => {
                const ss = S.sessions.filter((s) => s.projectId === p.id).slice(0, 2);
                const h = H.host(p.hostId);
                return `<button class="sb-row" data-a="pick-project" data-id="${p.id}"><span class="badge">${E(p.name[0].toUpperCase())}</span><span class="ell grow">${E(p.name)}</span>${h && h.status !== "online" ? I("offline", "sm") : ""}</button>
          ${ss.map((s) => `<button class="sb-sub" data-a="open-session" data-id="${s.id}">${s.status === "running" ? '<span class="dot run"></span>' : s.status === "needs" ? '<span class="dot warn"></span>' : '<span class="dot" style="opacity:.35"></span>'}<span class="ell">${E(s.title)}</span><span class="t">${H.ago(s.ago)}</span></button>`).join("")}`;
              })
              .join("")
          : '<div class="sb-empty">No projects yet</div>'
      }
    </div>
    <div class="sb-foot"><button class="sb-new" data-a="focus" title="New">${I("plus")}</button>
      <button class="sb-search" data-a="nav" data-id="Search">${I("search", "sm")}Search<kbd>⌘K</kbd></button>
      <button class="sb-icon" data-a="nav" data-id="Usage" title="Usage">${I("gauge")}</button>
      <button class="sb-icon" data-a="sheet" data-sheet="hosts" title="Hosts">${I("server")}</button>
      <button class="sb-icon" data-a="nav" data-id="Help" title="Help">${I("help")}</button>
      <button class="sb-icon" data-a="nav" data-id="Settings" title="Settings">${I("settings")}</button></div>
  </aside>`;
};
U.header = (extra = "") => {
  if (H.compact) {
    const ctx = H.resolve();
    const h = ctx.host;
    return `<header class="header"><button class="hbtn" data-a="nav" data-id="Menu">${I("menu", "lg")}</button><span class="title">Home</span><span class="grow"></span>${extra}
      <button class="hbtn" data-a="sheet" data-sheet="hosts" title="Hosts">${I(h ? H.hostIcon(h) : "server", "lg")}<span class="dot ${h && h.status === "online" ? "ok" : "off"}" style="position:absolute;right:6px;bottom:7px"></span></button></header>`;
  }
  return `<header class="header"><button class="hbtn" data-a="nav" data-id="Toggle sidebar">${I("panel")}</button><span class="title">Home</span><span class="grow"></span>${extra}</header>`;
};

// ---------- Popovers ----------
const opt = (a, inner, extra = "") =>
  `<button class="opt" data-a="${a}" ${extra}>${inner}</button>`;
U.pop = (ctx) => {
  const S = H.S;
  const kind = S.pop?.kind;
  const custom = H.concept.pop?.(kind, ctx);
  if (custom) return custom;
  if (kind === "host") {
    const hosts = [...S.hosts].sort(
      (a, b) => H.isLocal(b) - H.isLocal(a) || (a.usedAgo ?? 1e9) - (b.usedAgo ?? 1e9),
    );
    return `<div class="pop-h">New message runs on</div>${
      hosts
        .map((h) => {
          const on = h.status === "online";
          const ready = H.readyProviders(h).length;
          const sub = on
            ? `${H.hostVia(h)} · ${ready ? `${ready} agent${ready > 1 ? "s" : ""} ready` : "no agent ready"}`
            : h.status === "connecting"
              ? "Connecting…"
              : `${h.status === "starting" ? "Starting…" : `Offline · last seen ${h.lastSeen || "—"}`}`;
          const right = on
            ? ctx.host?.id === h.id
              ? I("check", "check")
              : ""
            : h.status === "offline"
              ? `<span class="btn sm" style="margin-left:auto" data-a="reconnect" data-id="${h.id}">Reconnect</span>`
              : "";
          return opt(
            on ? "pick-host" : "noop",
            `${I(H.hostIcon(h))}<span class="grow"><span class="ell" style="display:block">${E(H.hostLabel(h))}${H.isLocal(h) ? ` <span class="quiet small">· ${E(h.name)}</span>` : ""}</span><span class="od">${E(sub)}</span></span><span class="dot ${on ? "ok" : "off"}"></span>${right}`,
            `data-id="${h.id}"`,
          );
        })
        .join("") ||
      '<div class="quiet small" style="padding:8px">No computers connected yet.</div>'
    }
      <hr>${opt("sheet", `${I("plus")}<span class="grow">Connect a computer<span class="od" style="display:block">Pairing link, QR, address or SSH</span></span>`, 'data-sheet="pair"')}`;
  }
  if (kind === "project") {
    const list = ctx.host ? H.projectsOn(ctx.host.id) : [];
    return `<div class="pop-h">Projects on ${E(ctx.host ? H.hostLabel(ctx.host) : "")}</div>${list.map((p) => opt("pick-project", `${I("folder")}<span class="grow"><span class="ell" style="display:block">${E(p.name)}</span><span class="od ell" style="display:block">${E(p.path)}</span></span>${ctx.project?.id === p.id ? I("check", "check") : ""}`, `data-id="${p.id}"`)).join("")}
      ${list.length ? "<hr>" : ""}${opt("pick-personal", `${I("spark")}<span class="grow">No project — chat with a personal assistant<span class="od" style="display:block">A bot with its own folder; good for questions and writing</span></span>${ctx.target.kind === "starter" ? I("check", "check") : ""}`)}
      ${opt("sheet", `${I("plus")}<span class="grow">Add a project…</span>`, 'data-sheet="add-project"')}`;
  }
  if (kind === "target") {
    const h = ctx.reason === "bot" ? H.host(S.memory.last?.hostId) || ctx.host : ctx.host;
    const ids = Object.keys(H.providers);
    return `<div class="pop-h">Agent session on ${E(h ? H.hostLabel(h) : "")}</div>${ids
      .map((id) => {
        const st = h?.providers[id];
        const ok = st === "ready";
        return opt(
          ok ? "pick-provider" : "noop",
          `${H.pv(id)}<span class="grow">${H.providers[id].name}<span class="od" style="display:block">${ok ? H.providers[id].model : st === "signin" ? "Not signed in" : "Not installed"}</span></span>${ctx.target.provider === id && ctx.target.kind !== "bot" ? I("check", "check") : ""}`,
          `data-id="${id}" ${ok ? "" : "disabled"}`,
        );
      })
      .join("")}${
      S.bots.length
        ? `<hr><div class="pop-h">Chat with a bot</div>${S.bots
            .map((b) => {
              const bh = H.host(b.hostId);
              return opt(
                "pick-bot",
                `<span class="pill" style="padding:0 5px">${E(b.initials)}</span><span class="grow">${E(b.name)}<span class="od" style="display:block">${E(H.hostLabel(bh))}${bh.status === "online" ? "" : " · offline"}</span></span>${ctx.target.botId === b.id ? I("check", "check") : ""}`,
                `data-id="${b.id}"`,
              );
            })
            .join("")}`
        : ""
    }`;
  }
  if (kind === "thinking")
    return `<div class="pop-h">Thinking</div>${["Low", "Medium", "High"].map((t) => opt("set", `${t}${(S.thinking || "High") === t ? I("check", "check") : ""}`, `data-k="thinking" data-v="${t}"`)).join("")}`;
  if (kind === "perm")
    return `<div class="pop-h">Permissions</div>${[
      ["Default permissions", "Ask before edits and commands"],
      ["Accept edits", "Edit files without asking"],
      ["Plan", "Read and plan only"],
    ]
      .map(([t, d]) =>
        opt(
          "set",
          `<span class="grow">${t}<span class="od" style="display:block">${d}</span></span>${(S.perm || "Default permissions") === t ? I("check", "check") : ""}`,
          `data-k="perm" data-v="${t}"`,
        ),
      )
      .join("")}`;
  return "";
};

// ---------- Sheets ----------
U.sheet = (ctx) => {
  const S = H.S;
  const [kind, id] = (S.sheet || "").split(":");
  const custom = H.concept.sheet?.(kind, id, ctx);
  if (custom) return custom;
  const shell = (title, body, foot = "") =>
    `<div class="sheet" role="dialog" aria-label="${E(title)}"><div class="sheet-h"><h3 class="grow">${title}</h3><button class="hbtn" data-a="close">${I("x")}</button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ""}</div>`;
  if (kind === "pair") {
    const m = S.pair.method;
    const methods = H.compact
      ? [
          ["qr", "Scan QR"],
          ["link", "Paste link"],
        ]
      : [
          ["link", "Pairing link"],
          ["direct", "Address"],
          ["ssh", "SSH"],
        ];
    const st = S.pair.state;
    const body = `<p class="muted" style="margin:0">On the computer: <b>Settings → your host → Pair Device</b>. It shows a QR code and a link.</p>
      <div class="tabs">${methods.map(([k, t]) => `<button class="${m === k ? "on" : ""}" data-a="pair-method" data-id="${k}">${t}</button>`).join("")}</div>
      ${
        m === "qr"
          ? `<div class="qr">${I("qr", "lg")}</div><p class="quiet small" style="text-align:center;margin:0">Point the camera at the QR code on your computer.</p>`
          : m === "link"
            ? '<div class="field"><label>Pairing link</label><input value="https://app.clisbot.com/pair#offer=…" aria-label="Pairing link"></div>'
            : m === "direct"
              ? '<div class="field"><label>Address</label><input value="office-imac.tailnet.ts.net:6767"></div><p class="quiet small" style="margin:0">Over Tailscale, a VPN or your local network.</p>'
              : '<div class="field"><label>SSH</label><input value="me@build-box"></div><p class="quiet small" style="margin:0">Clisbot starts the daemon over SSH and forwards the port.</p>'
      }
      ${st === "error" ? `<div class="notice warn">${I("alert")}<div>This link expired. Make a new one on the computer, then try again. What you typed is kept.</div></div>` : ""}
      <p class="quiet small" style="margin:0">${I("lock", "sm")} End-to-end encrypted. Agents and code stay on that computer.</p>`;
    const foot = `<button class="btn ghost sm" data-a="pair-expire">Simulate expired link</button><span class="grow"></span><button class="btn" data-a="close">Cancel</button>

      <div class="c5-tpl-col"><div class="c5-tpl-h">Comes with a bot <span class="pill ok">Creates a bot</span></div><div class="c5-tpl-list">${BOT_TPL.map((t) => `<button class="c5-card" data-a="sheet" data-sheet="tpl:${t.id}"><span class="ri">${I(t.icon)}</span><span class="grow"><b>${t.name}</b><span class="rm">${t.text}</span><span class="c5-adds">${I("plus", "sm")}${t.adds}</span></span></button>`).join("")}</div></div>
      <div class="c5-tpl-col"><div class="c5-tpl-h">Works in a project <span class="pill run">Needs a project</span></div><div class="c5-tpl-list">${PROJ_TPL.map((t) => `<button class="c5-card" data-a="c5-proj-tpl" data-id="${t.id}"><span class="ri">${I(t.icon)}</span><span class="grow"><b>${t.name}</b><span class="rm">${t.text}</span></span></button>`).join("")}</div></div>
    </div></section>`;

  // ---------- Lower Home: Inbox · Schedules & Hosts ----------
  const attnCard = (a) =>
    `<div class="c5-att">${U.attnIcon(a)}<div class="grow"><div class="rt ell">${E(a.title)}</div><div class="rm">${E(a.text)}</div>${a.s ? `<div class="rm">${U.meta(a.s)}</div>` : ""}</div><div class="acts">${U.attnActions(a)}</div></div>`;
  function inboxSection(limit = 3) {
    const att = H.attention().filter((a) => a.kind !== "offline");
    const updates = H.recent("all")
      .filter((s) => !["needs", "failed"].includes(s.status))
      .slice(0, limit);
    if (!att.length && !updates.length)
      return `<section><div class="sec-h"><h2>Inbox</h2></div><div class="empty">Replies, questions from agents and finished runs show up here.</div></section>`;
    return `<section><div class="sec-h"><h2>Inbox</h2>${att.length ? `<span class="pill warn">${att.length} need you</span>` : ""}<div class="right"><button class="btn ghost sm" data-a="c5-tab" data-id="inbox">Open Inbox ${I("right", "sm")}</button></div></div>
      ${att.length ? `<div class="c5-atts">${att.map(attnCard).join("")}</div>` : ""}
      <div class="rows" style="margin-top:8px">${updates.map((s) => U.sessionRow(s, { preview: true })).join("")}</div></section>`;
  }
  function schedulesSection(limit = 4) {
    const list = H.upcoming()
      .filter((k) => !k.paused)
      .slice(0, limit);
    return `<section><div class="sec-h"><h2>Schedules</h2><span class="sub">Up next</span><div class="right"><button class="btn ghost sm" data-a="c5-tab" data-id="schedules">All ${I("right", "sm")}</button></div></div>
      ${list.length ? `<div class="rows">${list.map(U.schedRow).join("")}</div>` : '<div class="empty">No schedules yet. <button class="link" data-a="nav" data-id="New schedule">New schedule</button></div>'}</section>`;
  }
  const hostRow = (
    h,
  ) => `<div class="c5-hrow">${hostIcon(h)}<button class="c5-hname grow ell" data-a="sheet" data-sheet="host:${h.id}" title="Agents, status and settings">${E(H.hostLabel(h))}${H.isLocal(h) ? ` <span class="quiet small">· ${E(h.name)}</span>` : ""}</button>
    <span class="quiet small c5-hide-sm">${h.usedAgo != null ? `used ${H.ago(h.usedAgo)} ago` : ""}</span>${statusDot(h)}
    ${h.status === "offline" ? `<button class="btn sm" data-a="sheet" data-sheet="fix:${h.id}">Fix</button>` : isOn(h) ? `<button class="btn sm ghost" data-a="c5-use-host" data-id="${h.id}">Use</button>` : `<span class="quiet small">${E(h.status)}</span>`}</div>`;
  function groupBlock(g, { limit = 3 } = {}) {
    const c = counts(g.hosts);
    const shown = usedFirst(g.hosts).slice(0, limit);
    const head = `<div class="c5-ghead">${I(g.hub?.managed ? "shield" : g.hub ? "globe" : "link", "sm")}<span class="grow ell"><b>${E(g.title)}</b> <span class="quiet small">${E(g.sub)}</span></span>
      ${g.hub?.status === "signin" ? `<button class="btn sm solid" data-a="c5-signin" data-id="${g.hub.id}">Sign in again</button>` : `<span class="quiet small">${c.on}/${c.all} online</span>`}</div>`;
    if (g.hub?.status === "signin")
      return `<div class="c5-group">${head}<div class="c5-hrow quiet small">${c.all} hosts hidden until you sign in.</div></div>`;
    return `<div class="c5-group">${head}${shown.map(hostRow).join("")}
      ${g.hosts.length > limit ? `<button class="c5-more" data-a="sheet" data-sheet="browse:${g.id}">${I("search", "sm")} Browse all ${g.hosts.length} hosts${g.hub?.managed ? " · Managed access" : ""}</button>` : ""}</div>`;
  }
  function hostsSection() {
    const l = local();
    return `<section><div class="sec-h"><h2>Hosts</h2><div class="right"><button class="btn ghost sm" data-a="sheet" data-sheet="help">${I("help", "sm")} Connection help</button></div></div>
      <div class="c5-groups">${l ? `<div class="c5-group">${hostRow(l)}</div>` : ""}${groups()
        .map((g) => groupBlock(g))
        .join("")}
      <div class="c5-connect-row"><button class="btn sm" data-a="sheet" data-sheet="pair">${I("monitor", "sm")} Connect a computer</button><button class="btn sm" data-a="sheet" data-sheet="add-hub">${I("globe", "sm")} Add a Hub</button></div></div></section>`;
  }
  function home(ctx) {
    const S = H.S;
    const active = S.sessions.length || S.schedules.length;
    const lower = active
      ? `<div class="c5-lower"><div class="c5-col">${inboxSection()}</div><div class="c5-col">${schedulesSection()}${hostsSection()}</div></div>`
      : `<div class="c5-lower one">${hostsSection()}</div>`;
    return `<div class="c5">${hostBar(ctx)}${hero(ctx)}${templates()}${lower}</div>`;
  }

  // ---------- Other tabs ----------
  const page = (title, sub, body, actions = "") =>
    `<div class="c5 c5-page"><div class="c5-page-h"><div><h1>${title}</h1>${sub ? `<div class="quiet">${sub}</div>` : ""}</div><div class="right">${actions}</div></div>${body}</div>`;
  function inboxPage() {
    const att = H.attention();
    const all = H.recent("all").filter((s) => !["needs", "failed"].includes(s.status));
    return page(
      "Inbox",
      "Questions from agents, failures and replies across all Hosts",
      `${att.length ? `<section><div class="sec-h"><h2>Needs you</h2><span class="pill warn">${att.length}</span></div><div class="c5-atts">${att.map(attnCard).join("")}</div></section>` : '<div class="empty">Nothing needs you.</div>'}
      <section><div class="sec-h"><h2>Updates</h2></div><div class="rows">${all.map((s) => U.sessionRow(s, { preview: true })).join("") || '<div class="empty">No updates yet.</div>'}</div></section>`,
    );
  }
  function schedulesPage() {
    const list = H.upcoming();
    const grp = [
      ["Today", list.filter((k) => !k.paused && k.day === "Today")],
      ["Later", list.filter((k) => !k.paused && k.day !== "Today")],
      ["Paused", list.filter((k) => k.paused)],
    ];
    return page(
      "Schedules",
      "Schedules and heartbeats on every Host · your time UTC+7",
      grp
        .filter(([, l]) => l.length)
        .map(
          ([t, l]) =>
            `<section><div class="sec-h"><h2>${t}</h2></div><div class="rows">${l.map(U.schedRow).join("")}</div></section>`,
        )
        .join("") || '<div class="empty">No schedules yet.</div>',
      `<button class="btn solid sm" data-a="nav" data-id="New schedule">${I("plus", "sm")} New schedule</button>`,
    );
  }
  function settingsPage() {
    const S = H.S;
    const hubs = S.hubs
      .map(
        (
          x,
        ) => `<div class="c5-hrow">${I(x.managed ? "shield" : "globe", "sm")}<span class="grow"><b>${E(x.name)}</b> <span class="quiet small">${E(x.kind)} · ${E(x.url)} · ${E(x.role)}</span></span>
      ${x.status === "online" ? '<span class="pill ok">Connected</span>' : x.status === "signin" ? `<button class="btn sm solid" data-a="c5-signin" data-id="${x.id}">Sign in again</button>` : '<span class="pill warn">Unreachable</span>'}<button class="btn sm ghost" data-a="sheet" data-sheet="hub:${x.id}">Details</button></div>`,
      )
      .join("");
    const row = (icon, t, d, a = "nav") =>
      `<button class="c5-set" data-a="${a}" data-id="${t}">${I(icon, "sm")}<span class="grow">${t}<span class="rm">${d}</span></span>${I("right", "sm")}</button>`;
    return page(
      "Settings",
      "",
      `<section><div class="sec-h"><h2>Hosts &amp; Hubs</h2></div><div class="c5-groups">${local() ? `<div class="c5-group">${hostRow(local())}</div>` : ""}${groups()
        .map((g) => groupBlock(g, { limit: 5 }))
        .join("")}
        <div class="c5-group"><div class="c5-ghead"><b class="grow">Your Hubs</b><span class="quiet small">${S.hubs.length || "None"}</span></div>${hubs || '<div class="c5-hrow quiet small">A Hub shares Hosts with you: your own, or your company\'s.</div>'}</div>
        <div class="c5-connect-row"><button class="btn sm" data-a="sheet" data-sheet="pair">${I("monitor", "sm")} Connect a computer</button><button class="btn sm" data-a="sheet" data-sheet="add-hub">${I("globe", "sm")} Add a Hub</button><button class="btn sm ghost" data-a="sheet" data-sheet="help">${I("help", "sm")} Fix a connection</button></div></div></section>
      <section><div class="sec-h"><h2>App</h2></div><div class="rows">${row(S.theme === "dark" ? "sun" : "moon", "Appearance", S.theme === "dark" ? "Dark" : "Light", "theme")}${row("bell", "Notifications", "Questions from agents, failed runs")}${row("grid", "Connectors", "Apps and MCP servers agents may use")}${row("gauge", "Usage", "Tokens and cost by provider")}</div></section>
      <section><div class="sec-h"><h2>Help &amp; support</h2></div><div class="rows">${row("help", "Docs", "clisbot.com/docs")}${row("chat", "Community", "Discord")}${row("alert", "Report a problem", "Sends logs you choose")}</div><p class="quiet small">Clisbot 0.11.1</p></section>`,
    );
  }
  function chatPage() {
    const S = H.S;
    const projects = S.projects.filter(
      (p) => !p.botHome && S.sessions.some((s) => s.projectId === p.id),
    );
    const sess = (s) =>
      `<button class="sb-sub" style="padding-left:12px" data-a="open-session" data-id="${s.id}">${s.status === "running" ? '<span class="dot run"></span>' : s.status === "needs" ? '<span class="dot warn"></span>' : '<span class="dot" style="opacity:.35"></span>'}<span class="ell">${E(s.title)}</span><span class="t">${H.ago(s.ago)}</span></button>`;
    return `<div class="c5 c5-chat"><div class="sb-search" style="height:38px">${I("search", "sm")}Search chats and sessions</div>
      <section><div class="sec-h"><h2>Bots</h2><div class="right"><button class="hbtn" data-a="sheet" data-sheet="tpl:blank" title="Create bot">${I("plus")}</button></div></div>
        <div class="rows">${
          S.bots
            .map((b) => {
              const last = S.sessions.find((s) => s.botId === b.id);
              return `<button class="row" data-a="pick-bot-chat" data-id="${b.id}"><span class="ri">${E(b.initials)}</span><span class="grow"><span class="rt" style="display:block">${E(b.name)}</span><span class="rm ell" style="display:block">${E(last?.preview || "Say hello")}</span></span><span class="rr">${last ? H.ago(last.ago) : ""}</span></button>`;
            })
            .join("") || '<div class="empty">No bots yet. Your first quick chat creates one.</div>'
        }</div></section>
      ${S.groups.length ? `<section><div class="sec-h"><h2>Group chats</h2></div><div class="rows">${S.groups.map((g) => `<button class="row" data-a="nav" data-id="${E(g.name)}"><span class="ri">${I("chat")}</span><span class="grow"><span class="rt" style="display:block">${E(g.name)}</span><span class="rm">${g.bots.map((id) => E(H.bot(id)?.name)).join(", ")}</span></span><span class="rr">${H.ago(g.ago)}</span></button>`).join("")}</div></section>` : ""}
      <section><div class="sec-h"><h2>Projects</h2></div>${
        projects
          .map(
            (p) =>
              `<div class="c5-proj"><div class="c5-proj-h">${I("folder", "sm")}<b class="grow ell">${E(p.name)}</b><span class="quiet small">${E(H.hostLabel(H.host(p.hostId)))}</span></div>${S.sessions
                .filter((s) => s.projectId === p.id)
                .map(sess)
                .join("")}</div>`,
          )
          .join("") || '<div class="empty">No projects yet.</div>'
      }</section>
      <button class="c5-fab" data-a="c5-tab" data-id="home" title="New chat">${I("pencil")}</button></div>`;
  }

  // ---------- Navigation: sidebar (desktop) and bottom tabs (mobile) ----------
  const TABS = [
    ["home", "home", "Home"],
    ["chat", "chat", "Chat"],
    ["inbox", "inbox", "Inbox"],
    ["schedules", "automation", "Schedules"],
    ["settings", "settings", "Settings"],
  ];
  const inboxCount = () => H.attention().filter((a) => a.kind !== "offline").length;
  const defaultNavTail = () =>
    `<button class="sb-item" data-a="nav" data-id="New workspace">${I("plus")}New workspace</button><button class="sb-item" data-a="nav" data-id="History">${I("history")}History</button>`;
  function sidebar(navTail = defaultNavTail()) {
    const S = H.S;
    const navItem = (id, icon, t, extra = "") =>
      `<button class="sb-item ${S.tab === id ? "on" : ""}" data-a="c5-tab" data-id="${id}">${I(icon)}<span class="grow">${t}</span>${extra}</button>`;
    const n = inboxCount();
    const iss = issues().length;
    const base = U.sidebar();
    // Keep the current sidebar's Chat sections and footer; put Home, Inbox and Schedules first.
    return base
      .replace(
        /<div class="sb-nav">[\s\S]*?<\/div>/,
        `<div class="sb-nav">${navItem("home", "home", "Home")}${navItem("inbox", "inbox", "Inbox", n ? `<span class="pill warn">${n}</span>` : "")}${navItem("schedules", "automation", "Schedules")}
        ${navTail}</div>`,
      )
      .replace(
        /<button class="sb-icon" data-a="sheet" data-sheet="hosts" title="Hosts">[\s\S]*?<\/button>/,
        `<button class="sb-icon" data-a="sheet" data-sheet="hosts" title="Hosts" style="position:relative">${I("server")}${iss ? '<span class="c5-badge"></span>' : ""}</button>`,
      )
      .replace(
        /<button class="sb-icon" data-a="nav" data-id="Settings" title="Settings">/,
        `<button class="sb-icon ${S.tab === "settings" ? "on" : ""}" data-a="c5-tab" data-id="settings" title="Settings">`,
      )
      .replace(
        /(<div class="sb-head">[\s\S]*?Bots[\s\S]*?)(<div class="sb-head">)/,
        `$1${S.groups.length ? `<div class="sb-head">${I("chat")}Group chats</div>${S.groups.map((g) => `<button class="sb-row" data-a="nav" data-id="${E(g.name)}"><span class="badge">${I("chat", "sm")}</span><span class="ell">${E(g.name)}</span></button>`).join("")}` : ""}$2`,
      );
  }
  const title = () => TABS.find(([id]) => id === H.S.tab)?.[2] || "Home";
  function header(ctx) {
    const iss = issues().length;
    const l = local() || H.S.hosts.find(isOn);
    if (H.compact)
      return `<header class="header"><span class="title">${title()}</span><span class="grow"></span>
      <button class="hbtn" data-a="sheet" data-sheet="hosts" title="Hosts">${I("server", "lg")}<span class="dot ${iss ? "warn" : l && isOn(l) ? "ok" : "off"}" style="position:absolute;right:6px;bottom:7px"></span></button></header>`;
    return `<header class="header"><button class="hbtn" data-a="nav" data-id="Toggle sidebar">${I("panel")}</button><span class="title">${title()}</span><span class="grow"></span>${ctx && iss ? `<button class="btn sm ghost" data-a="sheet" data-sheet="hosts">${I("alert", "sm")} ${iss} connection issue${iss > 1 ? "s" : ""}</button>` : ""}</header>`;
  }
  const tabbar = () =>
    `<nav class="c5-tabs">${TABS.map(([id, icon, t]) => `<button class="${H.S.tab === id ? "on" : ""}" data-a="c5-tab" data-id="${id}">${I(icon, "lg")}<span>${t}</span>${id === "inbox" && inboxCount() ? `<span class="count">${inboxCount()}</span>` : ""}</button>`).join("")}</nav>`;

  // ---------- Popovers ----------
  function hostPop(ctx) {
    const S = H.S;
    const q = S.hostq.trim().toLowerCase();
    const visible = S.hosts.filter((h) => h.status !== "unknown");
    const item = (h) =>
      `<button class="opt" data-a="${isOn(h) ? "pick-host" : "noop"}" data-id="${h.id}" ${isOn(h) ? "" : "disabled"}>${hostIcon(h)}<span class="grow"><span class="ell" style="display:block">${E(H.hostLabel(h))}</span><span class="od">${E(H.hostVia(h))}${isOn(h) ? "" : ` · ${E(h.status)}`}</span></span>${statusDot(h)}${ctx.host?.id === h.id ? I("check", "check") : ""}</button>`;
    let body;
    if (q) {
      const hits = visible.filter((h) =>
        `${h.name} ${H.hostLabel(h)} ${h.via}`.toLowerCase().includes(q),
      );
      body = `${hits.slice(0, 30).map(item).join("") || '<div class="quiet small" style="padding:8px">No host matches.</div>'}${hits.length > 30 ? `<div class="quiet small" style="padding:6px 8px">${hits.length - 30} more — keep typing</div>` : ""}`;
    } else {
      const recent = usedFirst(visible.filter((h) => h.usedAgo != null || H.isLocal(h))).slice(
        0,
        5,
      );
      body = `<div class="pop-h">Recent</div>${recent.map(item).join("")}${groups()
        .map(
          (g) =>
            `<hr><button class="opt" data-a="sheet" data-sheet="${g.hub?.status === "signin" ? `hub:${g.id}` : `browse:${g.id}`}">${I(g.hub?.managed ? "shield" : g.hub ? "globe" : "link", "sm")}<span class="grow">${E(g.title)}<span class="od" style="display:block">${g.hub?.status === "signin" ? "Sign in to see its hosts" : `${counts(g.hosts).on} of ${g.hosts.length} online · browse`}</span></span>${I("right", "sm")}</button>`,
        )
        .join("")}`;
    }
    return `<div style="padding:4px 4px 6px"><input class="c5-search" id="hostq" data-model="hostq" value="${E(S.hostq)}" placeholder="Search ${visible.length} hosts" aria-label="Search hosts"></div>${body}
      <hr><button class="opt" data-a="sheet" data-sheet="pair">${I("plus")}<span class="grow">Connect a computer</span></button><button class="opt" data-a="sheet" data-sheet="add-hub">${I("globe")}<span class="grow">Add a Hub</span></button>`;
  }
  function pop(kind, ctx) {
    if (kind === "host") return hostPop(ctx);
    if (kind === "c5-connect")
      return `<div class="pop-h">Connect</div>
      <button class="opt" data-a="sheet" data-sheet="pair">${I("monitor")}<span class="grow">Connect a computer<span class="od" style="display:block">Pairing link, QR, address or SSH</span></span></button>
      <button class="opt" data-a="sheet" data-sheet="add-hub">${I("globe")}<span class="grow">Add a Hub<span class="od" style="display:block">Your own Hub or your company's</span></span></button>
      <hr><button class="opt" data-a="sheet" data-sheet="help">${I("help")}<span class="grow">Fix a connection</span></button>`;
    if (kind === "c5-bots")
      return `<div class="pop-h">Chat with a bot</div>${H.S.bots.map((b) => `<button class="opt" data-a="pick-bot" data-id="${b.id}"><span class="pill" style="padding:0 5px">${E(b.initials)}</span><span class="grow">${E(b.name)}<span class="od" style="display:block">${E(H.hostLabel(H.host(b.hostId)))}</span></span>${ctx.target.botId === b.id ? I("check", "check") : ""}</button>`).join("") || '<div class="quiet small" style="padding:8px">No bots yet.</div>'}
      <hr><button class="opt" data-a="sheet" data-sheet="tpl:blank">${I("plus")}<span class="grow">Create bot</span></button>`;
    return "";
  }

  // ---------- Sheets ----------
  const shell = (t, body, foot = "") =>
    `<div class="sheet" role="dialog" aria-label="${E(t)}"><div class="sheet-h"><h3 class="grow">${t}</h3><button class="hbtn" data-a="close">${I("x")}</button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ""}</div>`;
  function browseSheet(id) {
    const S = H.S;
    const g = groups().find((x) => x.id === id);
    const q = S.browseq.trim().toLowerCase();
    const f = S.browseFilter;
    const list = usedFirst(g.hosts).filter(
      (h) => (!q || h.name.includes(q)) && (f === "all" || (f === "online" ? isOn(h) : !isOn(h))),
    );
    return shell(
      `${E(g.title)} · ${g.hosts.length} hosts`,
      `${g.hub?.managed ? `<div class="notice">${I("shield")}<div><b>Managed access.</b> ${E(g.title)} decides who can start sessions on these Hosts; each new session gets a Hub access ticket.</div></div>` : ""}
      <input class="c5-search" id="browseq" data-model="browseq" value="${E(S.browseq)}" placeholder="Search by name, e.g. gpu, staging, dev-">
      <span class="tabs">${[
        ["all", "All"],
        ["online", "Online"],
        ["offline", "Not online"],
      ]
        .map(
          ([k, t]) =>
            `<button class="${f === k ? "on" : ""}" data-a="c5-browse-filter" data-id="${k}">${t}</button>`,
        )
        .join("")}</span>
      <div class="c5-group">${list.slice(0, 60).map(hostRow).join("") || '<div class="c5-hrow quiet small">No host matches.</div>'}${list.length > 60 ? `<div class="c5-hrow quiet small">${list.length - 60} more · refine the search</div>` : ""}</div>`,
    );
  }
  function fixSheet(id) {
    const h = H.host(id);
    const managed = h.managed;
    const step = (ok, t, d) =>
      `<div class="step ${ok === true ? "done" : ok === false ? "now" : ""}"><span class="n">${ok === true ? I("check", "sm") : ok === false ? "!" : "·"}</span><div class="grow"><div class="st">${t}</div>${d ? `<div class="sd">${d}</div>` : ""}</div></div>`;
    return shell(
      `Fix connection · ${E(H.hostLabel(h))}`,
      `<div class="setup"><div class="setup-steps">
        ${step(true, "This device is online", "")}
        ${step(true, `${E(h.via)} is reachable`, "")}
        ${step(false, `${E(h.name)} didn't answer`, `Last seen ${E(h.lastSeen || "—")}. Checked ${managed ? "through the Hub" : `${E(h.name.toLowerCase().replace(/\s+/g, "-"))}.tailnet.ts.net:6767`}.`)}

      <div><b>Most likely</b><ul class="c5-ul"><li>The computer is asleep or turned off.</li><li>Clisbot stopped there. On that computer run <code>clisbot daemon status</code>, or open the desktop app.</li>${managed ? "<li>The Hub admin took it offline for maintenance.</li>" : "<li>Tailscale is signed out on one side.</li>"}</ul></div>

  function hubSheet(id) {
    const x = hub(id);
    const hosts = H.S.hosts.filter((h) => h.hubId === id);
    return shell(
      `${E(x.name)} Hub`,
      `<dl class="kv"><dt>Kind</dt><dd>${E(x.kind)} Hub</dd><dt>Address</dt><dd>${E(x.url)}</dd><dt>You are</dt><dd>${E(x.role)}</dd><dt>Hosts</dt><dd>${x.status === "signin" ? `${hosts.length} · hidden until you sign in` : `${counts(hosts).on} of ${hosts.length} online`}</dd>${x.managed ? "<dt>Access</dt><dd>Managed access: the Hub grants each session</dd>" : ""}</dl>

  }
  const addHubSheet = () =>
    shell(
      "Add a Hub",
      `<p class="muted" style="margin:0">A Hub shares Hosts with you: your own machines, or your company's build and dev servers. Signing in adds them here; nothing is installed on this device.</p>

  const helpSheet = () =>
    shell(
      "Connection help",
      `${issues()
        .map(
          (it) =>
            `<div class="c5-issue">${I("alert", "sm")}<span class="grow"><b>${E(it.title)}</b></span>${fixBtn(it)}</div>`,

        [
          "A host shows Offline",
          "Wake the computer, open Clisbot there or run clisbot daemon status, then Try again.",

        [
          "Web can't find this computer",

        [
          "The phone can't connect",

        ["A Hub asks to sign in", "Sign-ins expire. Sign in again; nothing on its Hosts stopped."],

        )
        .join("")}</div>`,
      `<button class="btn" data-a="nav" data-id="Docs">${I("external", "sm")} Open docs</button>`,

  function tplSheet(id) {

      id: "blank",
      name: "New bot",
      text: "A teammate with its own folder and instructions.",
      adds: "Bot",
    };
    const ctx = H.resolve();
    const h = ctx.host || H.S.hosts.find(isOn);
    return shell(
      id === "blank" ? "Create bot" : E(t.name),
      `<p class="muted" style="margin:0">${E(t.text)}</p>
      <div class="field"><label>Name</label><input value="${E(id === "blank" ? "My bot" : t.name.replace(/ bot$/, ""))}"></div>
      <dl class="kv"><dt>Runs on</dt><dd>${h ? E(H.hostLabel(h)) : "Connect a computer first"}</dd><dt>Agent</dt><dd>${E(H.providers[H.readyProviders(h)[0] || "claude"].name)} · Default permissions</dd><dt>Adds</dt><dd>${E(t.adds)}</dd><dt>Folder</dt><dd>~/.clisbot/bots/${E(id === "blank" ? "my-bot" : t.id)}</dd></dl>`,

            `<div class="c5-issue">${I("alert", "sm")}<span class="grow"><b>${E(it.title)}</b> <span class="quiet">· ${E(it.text)}</span></span>${fixBtn(it)}</div>`,

    );
  }
  // ---------- One Host: its agents, status and the ways to fix or set it up ----------
  const MODELS = { claude: 18, codex: 7, opencode: 604, copilot: 12 };
  const SIGNIN = {

  const provState = (st) =>
    st === "ready" ? "Ready" : st === "signin" ? "Not signed in" : "Not installed";
  const provRow = (h, id) => {
    const st = h.providers[id];
    const action =
      st === "ready"
        ? '<span class="pill ok">Ready</span>'
        : `<button class="btn sm ${st === "signin" ? "solid" : ""}" data-a="sheet" data-sheet="prov:${h.id}~${id}">${st === "signin" ? "Sign in" : "Install"}</button>`;
    return `<div class="c5-hrow">${H.pv(id)}<span class="grow">${H.providers[id].name}<span class="rm" style="display:block">${st === "ready" ? `${MODELS[id]} models · ${H.providers[id].model}` : provState(st)}</span></span>${action}</div>`;
  };
  function hostSheet(id) {
    const h = H.host(id);
    const on = isOn(h);
    const x = h.hubId && hub(h.hubId);
    const ss = H.S.sessions.filter((t) => t.hostId === id);
    const next = H.upcoming().find((k) => k.hostId === id && !k.paused);
    const ids = Object.keys(h.providers);
    const ready = H.readyProviders(h).length;
    const row = (icon, t, d, a, extra = "") =>
      `<button class="c5-set" data-a="${a}" ${extra}>${I(icon, "sm")}<span class="grow">${t}<span class="rm">${d}</span></span>${I("right", "sm")}</button>`;

      ${on ? "" : `<div class="notice warn">${I("offline")}<div class="grow">Last seen ${E(h.lastSeen || "—")}. Sessions and schedules here wait for it.<div class="acts"><button class="btn sm" data-a="sheet" data-sheet="fix:${h.id}">Troubleshoot</button></div></div></div>`}
      <section><div class="sec-h"><h2>Agents</h2><span class="sub">${ready} of ${ids.length} ready</span><div class="right"><button class="btn ghost sm" data-a="nav" data-id="Manage providers">Manage providers ${I("right", "sm")}</button></div></div>
        <div class="c5-group">${ids.map((pid) => provRow(h, pid)).join("")}</div>
        ${h.managed ? '<p class="quiet small" style="margin:6px 0 0">This Hub manages the agents on its Hosts; ask its admin to add one.</p>' : ""}</section>
      <section><div class="sec-h"><h2>Activity</h2></div><div class="quiet">${ss.length ? `${ss.filter((t) => t.status === "running").length} running · ${ss.filter((t) => t.status === "needs").length} need you · ${ss.length} sessions` : "No sessions yet"}${next ? `<br>Next run: ${E(next.name)} · ${E(next.day)} ${E(next.at)}` : ""}</div></section>
      <section><div class="rows">${row("settings", "Host settings", "Name, connections, folders, limits", "nav", 'data-id="Host settings"')}${row("alert", "Troubleshoot connection", "Check each step and the usual causes", "sheet", `data-sheet="fix:${h.id}"`)}${H.isLocal(h) ? row("phone", "Pair a phone", "Show a QR code for this Host", "sheet", 'data-sheet="pair"') : ""}${row("notes", "Logs", "daemon.log on this Host", "nav", 'data-id="Logs"')}</div></section>`;
    return shell(
      `${E(H.hostLabel(h))}${H.isLocal(h) ? ` <span class="quiet small">${E(h.name)}</span>` : ""}`,
      body,
      on
        ? `<button class="btn" data-a="close">Close</button><button class="btn solid" data-a="c5-use-host" data-id="${h.id}">Use for new messages</button>`
        : `<button class="btn solid" data-a="c5-retry" data-id="${h.id}">${I("refresh", "sm")} Try again</button>`,
    );
  }
  function provSheet(key) {
    const [hid, pid] = key.split("~");
    const h = H.host(hid);
    const st = h.providers[pid];
    const name = H.providers[pid].name;
    const waiting = H.S.provBusy === key;
    const signin = st === "signin";
    const body = `<p class="muted" style="margin:0">${signin ? `${E(name)} is installed on ${E(H.hostLabel(h))} but not signed in.` : `${E(name)} is not installed on ${E(H.hostLabel(h))}.`}</p>
      <div class="setup"><div class="setup-steps">
        <div class="step now"><span class="n">1</span><div class="grow"><div class="st">${signin ? "Clisbot opens a terminal on that Host and runs" : "Clisbot runs on that Host"}</div><div class="cmd" style="margin-top:6px"><span>${E(signin ? SIGNIN[pid] : INSTALL[pid])}</span><button class="btn sm ghost" data-a="copy">${I("copy", "sm")}</button></div></div></div>
        <div class="step"><span class="n">2</span><div class="grow"><div class="st">${signin ? "Finish in the browser it opens" : "Then sign in when it asks"}</div></div></div>

      ${h.managed ? '<div class="notice">' + I("shield") + "<div>Managed by the Hub. Ask your Hub admin to set this agent up.</div></div>" : ""}`;

      `<button class="btn" data-a="sheet" data-sheet="host:${hid}">Back</button><span class="grow"></span>
      <button class="btn solid" data-a="prov-run" data-id="${key}" ${waiting || h.managed || !isOn(h) ? "disabled" : ""}>${waiting ? `${I("loader", "sm spin")} Waiting…` : signin ? "Open terminal and sign in" : "Install on this Host"}</button>`,

  // ---------- Actions ----------
  const A = H.actions;

        H.host(hid).providers[pid] = "ready";

    "c5-tab"(el) {
      const S = H.S;
      S.tab = el.dataset.id;

      S.sheet = null;
      if (S.tab === "home") requestAnimationFrame(() => document.getElementById("draft")?.focus());

      if (H.bot("personal")) {

      const ctx = H.resolve();
      const h =
        ctx.reason === "bot"
          ? H.S.hosts.find((x) => H.isLocal(x) && isOn(x)) || ctx.host

      S.target = { kind: "starter" };

    "c5-project"() {
      const S = H.S;
      const ctx = H.resolve();

        if (h)
          S.pick = {
            hostId: h.id,
            projectId:
              S.memory.byHost[h.id] && H.project(S.memory.byHost[h.id])
                ? S.memory.byHost[h.id]
                : H.projectsOn(h.id)[0]?.id || null,
          };
        S.target = { kind: "agent", provider: (h && H.readyProviders(h)[0]) || "claude" };
      }
      S.pop = { kind: "project", anchor: "project" };
    },
    "c5-prompt"(el) {
      A["c5-quick"]();
      A.starter(el);
    },
    "c5-proj-tpl"(el) {
      const t = PROJ_TPL.find((x) => x.id === el.dataset.id);
      A["c5-project"]();
      H.S.pop = H.resolve().project ? null : { kind: "project", anchor: "project" };
      H.S.draft = t.text;

    "c5-use-host"(el) {

        id: "dev-long-web",
        hostId: "vx-dev-long",

      )(ctx),
    bottom: () => (H.compact ? tabbar() : ""),
    notes: `<h2>05 · App — điều hướng chuẩn + Host/Hub</h2>

      <li><b>Không Hub</b>: máy này + các máy ghép nối trực tiếp (Relay/Tailscale).</li>
      <li><b>1 Hub</b>: các Host đến từ Hub cá nhân; vẫn hiện máy này riêng ở đầu.</li>
