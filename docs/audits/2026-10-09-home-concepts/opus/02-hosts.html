        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .notice b {
        font-weight: 600;
      }
      .notice .x {
        margin-left: auto;
        border: 0;
        background: transparent;
        color: var(--quiet);
        padding: 2px;
        display: flex;
      }

      /* ---------- Setup panels ---------- */
      .setup {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        overflow: hidden;
      }
      .setup-h {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px;
      }
      .setup-h .glyph {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: var(--s2);
        display: grid;
        place-items: center;
        flex: none;
        color: var(--muted);
      }
      .setup-h h3 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
      }
      .setup-h p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .setup-steps {
        border-top: 1px solid var(--border-subtle);
      }
      .step {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .step:last-child {
        border-bottom: 0;
      }
      .step .n {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border-accent);
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--muted);
        flex: none;
      }
      .step.done .n {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .step.now .n {
        border-color: var(--fg);
        color: var(--fg);
        font-weight: 600;
      }
      .step .st {
        font-weight: 500;
      }
      .step .sd {
        font-size: 12px;
        color: var(--quiet);
        margin-top: 1px;
      }
      .step .sa {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .setup-foot {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        background: var(--s1);
        border-top: 1px solid var(--border-subtle);
        font-size: 12px;
        color: var(--quiet);
        flex-wrap: wrap;
      }
      .cmd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--s1);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }
      .cmd span {
        flex: 1;
      }

      /* ---------- Session rows ---------- */
      .rows {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-bottom: 1px solid var(--border-subtle);
        background: transparent;
        text-align: left;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--s1);
      }
      .row .ri {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--s2);
        display: grid;
        place-items: center;
        flex: none;
        color: var(--muted);
      }
      .row .ri .pv {
        width: 15px;
        height: 15px;
      }
      .row .rt {
        font-weight: 500;
      }
      .row .rm {
        font-size: 12px;
        color: var(--quiet);
      }
      .row .rr {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        flex: none;
        font-size: 12px;
        color: var(--quiet);
      }
      .row.new {
        animation: flash 1.6s ease-out;
      }
      @keyframes flash {
        from {
          background: var(--ok-tint);
        }
        to {
          background: transparent;
        }
      }
      .empty {
        padding: 18px;
        text-align: center;
        color: var(--quiet);
        font-size: 13px;
        border: 1px dashed var(--border-accent);
        border-radius: 10px;
      }

      /* ---------- Popover / sheet / toast ---------- */
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      .scrim.dim {
        background: #0000003d;
      }
      .pop {
        position: absolute;
        z-index: 31;
        width: 320px;
        max-height: 420px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--pop);
        padding: 6px;
      }
      .dark .pop {
        background: var(--s1);
      }
      .pop-h {
        padding: 6px 8px 4px;
        font-size: 11px;
        font-weight: 600;
        color: var(--quiet);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 8px;
        border: 0;
        background: transparent;
        border-radius: 6px;
        text-align: left;
      }
      .opt:hover:not(:disabled) {
        background: var(--s2);
      }
      .opt:disabled {
        opacity: 0.55;
      }
      .opt .od {
        font-size: 12px;
        color: var(--quiet);
      }
      .opt .check {
        margin-left: auto;
        color: var(--accent-bright);
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--border-subtle);
        margin: 4px 0;
      }
      .sheet {
        position: absolute;
        z-index: 32;
        right: 0;
        top: 0;
        bottom: 0;
        width: 440px;
        max-width: 100%;
        background: var(--bg);
        border-left: 1px solid var(--border);
        box-shadow: var(--pop);
        display: flex;
        flex-direction: column;
      }
      .mobile .sheet,
      .mobile .pop {
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        width: auto;
        max-height: 82%;
        border-radius: 16px 16px 0 0;
        border: 0;
      }
      .mobile .pop {
        padding: 10px 8px 22px;
      }
      .mobile .pop .opt {
        min-height: 44px;
      }
      .sheet-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .sheet-h h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .sheet-b {
        flex: 1;
        overflow: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .sheet-f {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 12px 16px;
        border-top: 1px solid var(--border-subtle);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .field input {
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--bg);
      }
      .qr {
        width: 168px;
        height: 168px;
        margin: 4px auto;
        border-radius: 10px;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(0deg, transparent 0 10px, #0000000a 10px 11px),
          repeating-linear-gradient(90deg, transparent 0 10px, #0000000a 10px 11px);
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 6px 12px;
        font-size: 13px;
      }
      .kv dt {
        color: var(--quiet);
      }
      .kv dd {
        margin: 0;
      }
      .toast {
        position: absolute;
        z-index: 40;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 14px;
        background: var(--primary);
        color: var(--primary-fg);
        border-radius: 9px;
        box-shadow: var(--pop);
        font-size: 13px;
        max-width: calc(100% - 24px);
      }
      .toast .link {
        color: inherit;
        text-decoration: underline;
      }
      .mobile .toast {
        bottom: 96px;
      }

      /* ---------- Design notes drawer ---------- */
      .notes {
        width: 380px;
        flex: none;
        height: calc(100vh - 110px);
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
        font-size: 13px;
      }
      .notes h2 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      .notes h3 {
        font-size: 13px;
        margin: 16px 0 6px;
      }
      .notes p,
      .notes li {
        color: var(--muted);
      }
      .notes ul {
        padding-left: 18px;
        margin: 6px 0;
      }
      .notes table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .notes td,
      .notes th {
        border-bottom: 1px solid var(--border-subtle);
        padding: 5px 4px;
        text-align: left;
        vertical-align: top;
      }
      .notes th {
        color: var(--quiet);
        font-weight: 500;
      }
      @media (max-width: 1100px) {
        .notes {
          position: fixed;
          right: 10px;
          top: 120px;
          z-index: 60;
          box-shadow: var(--pop);
          max-width: calc(100vw - 20px);
        }
      }
      @media (max-width: 760px) {
        .stage {
          padding: 0;
        }
        .frame,
        .frame.mobile {
          border: 0;
          border-radius: 0;
          height: calc(100vh - 140px);
          width: 100%;
          max-width: none;
          box-shadow: none;
        }
      }

      .c2 {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px 28px 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .c2-strip {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .c2-host {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        text-align: left;
        min-height: 104px;
        min-width: 0;
      }
      .c2-host:hover {
        background: var(--s1);
      }
      .c2-host.sel {
        border-color: var(--fg);
        box-shadow: 0 0 0 1px var(--fg);
      }
      .c2-host.off {
        background: var(--s1);
      }
      .c2-host.add {
        border-style: dashed;
        align-items: flex-start;
        justify-content: center;
        color: var(--muted);
      }
      .c2-host-top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .c2-host-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: auto;
        padding-top: 6px;
      }
      .c2-host .rm {
        font-size: 12px;
        color: var(--quiet);
      }
      .c2-pv {
        display: flex;
        gap: 6px;
        color: var(--muted);
      }
      .c2-compose {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .c2-projects {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .c2-proj {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 4px 10px;
        border-radius: 7px;
        font-size: 13px;
        color: var(--muted);
      }
      .c2-proj.on {
        background: var(--fg);
        border-color: var(--fg);
        color: var(--bg);
      }
      .c2-proj.add {
        border-style: dashed;
      }
      .c2-check {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .c2-check .step {
        border-bottom: 0;
        border-right: 1px solid var(--border-subtle);
      }
      .c2-check .step:last-child {
        border-right: 0;
      }
      .c2-board {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      .c2-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .c2-col .row .rm {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c2-att {
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 8px;
        align-items: flex-start;
      }
      .c2-att .dot {
        margin-top: 6px;
      }
      .c2-att .rt {
        font-weight: 500;
      }
      .c2-att .rm {
        font-size: 12px;
        color: var(--quiet);
      }
      .c2-att .acts {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .c2-tabs {
        margin-bottom: 10px;
      }
      .mobile .c2 {
        padding: 14px 12px 28px;
        gap: 16px;
      }
      .mobile .c2-strip {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -12px;
        padding: 2px 12px;
      }
      .mobile .c2-host {
        flex: 0 0 236px;
      }
      .mobile .c2-check {
        grid-template-columns: 1fr;
      }
      .mobile .c2-check .step {
        border-right: 0;
        border-bottom: 1px solid var(--border-subtle);
      }
      @media (max-width: 1180px) {
        .c2-board {
          grid-template-columns: 1fr 1fr;
        }
        .c2-board .c2-col:first-child {
          grid-column: 1 / -1;
        }
      }
    </style>

          H.seedVariant(H.currentVariant() || C.variants[0], device);
      };
      H.saveUi = () => {
        const S = H.S;
        const ui = {
          scenario: S.scenario,
          device: S.device,
          theme: S.theme,
          notes: S.notes ? "1" : "0",
          hub: S.hub,
        };
        sessionStorage.setItem(KEY, JSON.stringify(ui));
        history.replaceState(null, "", `#${new URLSearchParams(ui)}`);
      };
      H.seed = (scenarioId, ui = {}) => {
        const sc = H.scenarios.find((s) => s.id === scenarioId) || H.scenarios[0];
        const data = baseData();
        const device = sc.device || (ui.device && ui.device !== "auto" ? ui.device : "desktop");
        if (sc.fresh) {
          data.sessions = [];
          data.schedules = [];
          data.bots = [];
          data.projects = [];
          data.hosts = device === "mobile" ? [] : [{ ...data.hosts[0], usedAgo: null }];
        }
        if (sc.providersMissing)
          data.hosts[0].providers = {
            claude: "signin",
            codex: "missing",
            opencode: "missing",
            copilot: "missing",
          };
        if (sc.allOffline)
          data.hosts.forEach((h) => {
            h.status = "offline";
            h.lastSeen = h.lastSeen || "6 min ago";
          });
        if (sc.busy) {
          data.sessions.find((s) => s.id === "s3").status = "needs";
          data.sessions.find((s) => s.id === "s3").ask = "Edit 3 files in packages/server?";
          data.sessions.find((s) => s.id === "s3").preview =
            "Wants to edit 3 files in packages/server";
          data.schedules.unshift({
            id: "k0",
            kind: "Schedule",
            name: "Morning triage",
            target: "Codex",
            projectId: "clisbot",
            hostId: "mac",
            at: "09:00",
            day: "Today",
            inMin: -380,
            cadence: "Weekdays at 09:00",
            runIn: "A new agent session",
            failed: "Codex stopped: rate limit",
          });
        }
        const local = sc.local || (data.hosts.some((h) => h.kind === "local") ? "ready" : "none");
        if (local !== "ready" && data.hosts[0])
          data.hosts[0].status = local === "starting" ? "starting" : "unknown";
        if (local === "probing" || local === "missing" || local === "blocked") data.hosts = [];
        H.S = {
          scenario: sc.id,
          sc,
          device,
          theme: ui.theme || H.S?.theme || "light",
          notes: ui.notes ?? H.S?.notes ?? false,
          // Which Hubs the user has joined; only concepts with an onSeed hook use it.
          hub: ui.hub || H.S?.hub || "many",
          ...data,
          local,
          memory: sc.memory ? structuredClone(sc.memory) : { last: null, byHost: {} },
          draft: sc.draft || "",
          pick: null,
          target: null,
          pop: null,
          sheet: null,
          toast: null,
          filter: "all",
          dismissed: {},
          recentIds: [],
          pair: { method: device === "mobile" ? "qr" : "link", state: "idle" },
          probeCount: 0,
        };
        H.concept?.onSeed?.(H.S);
        H.timers?.forEach(clearTimeout);
        H.timers = [];
        if (local === "starting")
          H.later(2200, () => {
            H.S.hosts[0].status = "online";
            H.S.local = "ready";
            H.toast("LongPro2Max is ready");
          });
        if (local === "probing") H.probe(true);
      };
      H.later = (ms, fn) =>
        H.timers.push(
          setTimeout(() => {
            fn();
            H.render();
          }, ms),
        );

      // ---------- Lookups ----------
      H.host = (id) => H.S.hosts.find((h) => h.id === id);
      H.project = (id) => H.S.projects.find((p) => p.id === id);
      H.bot = (id) => H.S.bots.find((b) => b.id === id);
      H.online = (h) => h && h.status === "online";
      H.isLocal = (h) => h && h.kind === "local" && H.S.device !== "mobile";
      H.hostLabel = (h) =>
        H.isLocal(h) ? (H.S.device === "web" ? "This computer" : "This Mac") : h.name;
      H.hostVia = (h) => (H.isLocal(h) ? "Local" : h.via === "This computer" ? "Relay" : h.via);
      H.hostIcon = (h) => (H.isLocal(h) ? "monitor" : "server");
      H.readyProviders = (h) =>
        h ? Object.keys(h.providers).filter((p) => h.providers[p] === "ready") : [];
      H.ago = (m) =>
        m == null
          ? ""
          : m < 1
            ? "now"
            : m < 60
              ? `${m}m`
              : m < 1440
                ? `${Math.round(m / 60)}h`
                : m < 2880
                  ? "yesterday"
                  : `${Math.round(m / 1440)}d`;
      H.inText = (m) =>
        m < 0
          ? "missed"
          : m < 60
            ? `in ${m} min`
            : m < 1440
              ? `in ${Math.floor(m / 60)} h ${m % 60 ? `${m % 60} min` : ""}`.trim()
              : "";
      H.projectsOn = (hostId, withBotHomes = false) =>
        H.S.projects
          .filter((p) => p.hostId === hostId && !p.scratch && (withBotHomes || !p.botHome))
          .sort((a, b) => a.usedAgo - b.usedAgo);
      H.sessionWho = (s) =>
        s.kind === "chat" ? H.bot(s.botId)?.name || "Bot" : H.providers[s.provider]?.name;

      // ---------- Context resolver: which Host/Project a NEW message goes to ----------
      // Order: manual pick in this draft → last successful send if valid → same Host, its last
      // Project → another online Host (local first on Desktop/Web), its last Project → nothing.
      // Existing sessions and schedules never move; this only decides the next new message.
      H.resolve = () => {
        const S = H.S;
        const out = {
          host: null,
          project: null,
          target: null,
          reason: null,
          notice: null,
          blocker: null,
        };
        const remembered = S.memory.last;
        const target = S.target || remembered?.target || { kind: "starter", provider: "claude" };
        out.target = target;
        if (target.kind === "bot") {
          const bot = H.bot(target.botId);
          out.host = H.host(bot.hostId);
          out.project = H.project(bot.projectId);
          out.reason = "bot";
          if (!H.online(out.host)) out.blocker = { kind: "bot-offline", host: out.host };
          return finish(out);
        }
        const pick = S.pick;
        if (pick && H.online(H.host(pick.hostId))) {
          out.host = H.host(pick.hostId);
          out.project = pick.projectId ? H.project(pick.projectId) : null;
          out.reason = "picked";
          return finish(out);
        }
        const lastHost = remembered && H.host(remembered.hostId);
        const lastProject = remembered && H.project(remembered.projectId);
        if (H.online(lastHost)) {
          out.host = lastHost;
          if (lastProject) {
            out.project = lastProject;
            out.reason = "last";
          } else {
            out.project = H.projectsOn(lastHost.id)[0] || null;
            out.reason = "project-gone";
            out.notice = { kind: "project-gone", from: remembered.projectId, to: out.project };
          }
          return finish(out);
        }
        const online = S.hosts
          .filter(H.online)
          .sort((a, b) => H.isLocal(b) - H.isLocal(a) || (a.usedAgo ?? 1e9) - (b.usedAgo ?? 1e9));
        if (online.length) {
          out.host = online[0];
          const rememberedOnHost = H.project(S.memory.byHost[out.host.id]);
          out.project = rememberedOnHost || H.projectsOn(out.host.id)[0] || null;
          out.reason = remembered ? "host-offline" : "first";
          if (remembered)
            out.notice = {
              kind: "host-offline",
              from: lastHost,
              fromProject: lastProject,
              to: out.host,
            };
          return finish(out);
        }
        out.reason = remembered ? "host-offline" : "first";
        out.blocker =
          S.local === "starting"
            ? { kind: "starting" }
            : S.local === "probing"
              ? { kind: "probing" }
              : S.local === "missing"
                ? { kind: "web-missing" }
                : S.local === "blocked"
                  ? { kind: "web-blocked" }
                  : S.device === "mobile" && !S.hosts.length
                    ? { kind: "mobile-pair" }
                    : { kind: "all-offline" };
        if (S.local === "starting") out.host = S.hosts[0];
        return finish(out);
      };
      function finish(out) {
        const S = H.S;
        if (out.target.kind === "starter" && out.host) {
          const provider = H.readyProviders(out.host)[0] || "claude";
          // A first message with no Project starts a personal assistant; with a Project it is an agent session.
          out.target = out.project ? { kind: "agent", provider } : { kind: "starter", provider };
        }
        if (
          out.target.kind === "agent" &&
          out.host &&
          H.online(out.host) &&
          out.host.providers[out.target.provider] !== "ready"
        ) {
          const alt = H.readyProviders(out.host)[0];
          if (alt) out.target = { ...out.target, provider: alt, swapped: true };
        }
        if (!out.blocker && out.host && H.online(out.host) && !H.readyProviders(out.host).length)
          out.blocker = { kind: "providers", host: out.host };
        if (!out.blocker && out.target.kind === "agent" && !out.project)
          out.blocker = { kind: "no-project", host: out.host };
        if (out.notice && S.dismissed[out.notice.kind]) out.notice = null;
        out.canSend = !out.blocker;
        return out;
      }

      // ---------- Derived lists ----------
      H.attention = () => {
        const S = H.S;
        const items = [];
        S.sessions
          .filter((s) => s.status === "needs")
          .forEach((s) =>
            items.push({ kind: "needs", s, title: s.title, text: s.ask, ago: s.ago }),
          );
        S.sessions
          .filter((s) => s.status === "failed")
          .forEach((s) =>
            items.push({ kind: "failed", s, title: s.title, text: s.preview, ago: s.ago }),
          );
        S.schedules
          .filter((k) => k.failed)
          .forEach((k) =>
            items.push({ kind: "run-failed", k, title: k.name, text: k.failed, ago: 380 }),
          );
        S.hosts
          .filter((h) => h.status === "offline")
          .forEach((h) => {
            const sessions = S.sessions.filter((s) => s.hostId === h.id).length;
            const sched = S.schedules.filter((k) => k.hostId === h.id && !k.paused).length;
            if (sessions + sched)
              items.push({
                kind: "offline",
                h,
                title: `${h.name} is offline`,
                text: `${[sessions && `${sessions} session`, sched && `${sched} upcoming run`].filter(Boolean).join(" · ")} · last seen ${h.lastSeen}`,
              });
          });
        return items;
      };
      H.recent = (filter = H.S.filter) =>
        H.S.sessions
          .filter(
            (s) => filter === "all" || (filter === "chat" ? s.kind === "chat" : s.kind === "agent"),
          )
          .sort((a, b) => a.ago - b.ago);
      H.upcoming = () =>
        H.S.schedules
          .filter((k) => !k.failed)
          .sort((a, b) => a.paused - b.paused || a.inMin - b.inMin);

      // ---------- Simulated host operations ----------
      H.probe = (first) => {
        const S = H.S;
        S.local = "probing";
        S.probeCount += 1;
        // Demo: the automatic first probe only succeeds in "found"; "Look again" assumes the user fixed it.
        const findsIt = S.sc.id === "first-web-found" || !first;
        H.later(1300, () => {
          if (findsIt) {
            const mac = baseData().hosts[0];
            H.S.hosts = [{ ...mac, usedAgo: null }, ...H.S.hosts.filter((h) => h.id !== "mac")];
            H.S.local = "ready";
            H.toast("Found Clisbot on this computer");
          } else H.S.local = S.sc.local === "blocked" ? "blocked" : "missing";
        });
        if (!first) H.render();
      };
      H.reconnect = (hostId) => {
        const h = H.host(hostId);
        h.status = "connecting";
        H.later(1200, () => {
          h.status = "online";
          H.toast(`${H.hostLabel(h)} is back online`);
        });
      };
      H.pairDone = () => {
        const S = H.S;
        // The paired computer arrives with the Projects it already has.
        const mac = { ...baseData().hosts[0], kind: "remote", via: "Relay", usedAgo: null };
        if (S.device !== "mobile") Object.assign(mac, { id: "paired", name: "Office iMac" });
        S.hosts = [...S.hosts.filter((h) => h.id !== mac.id), mac];
        if (!S.projects.some((p) => p.hostId === mac.id)) {
          S.projects.push({
            id: `${mac.id}-site`,
            hostId: mac.id,
            name: S.device === "mobile" ? "clisbot" : "website",
            path: "~/projects",
            usedAgo: 60,
          });
        }
        S.pick = { hostId: mac.id, projectId: H.projectsOn(mac.id)[0]?.id || null };
        if (S.device === "mobile") {
          S.local = "none";
        }
        S.sheet = null;
        H.toast(`Connected to ${mac.name}`);
      };

      // ---------- Sending ----------
      H.send = () => {
        const S = H.S;
        const ctx = H.resolve();
        const text = S.draft.trim();
        if (!ctx.canSend || !text) return;
        let { project, target } = ctx;
        if (target.kind === "starter" && H.concept.quickChatProject) {
          // A concept may run "No project" chats in a scratch folder on the Host instead of creating a Bot.
          project = H.concept.quickChatProject(ctx.host);
          target = { kind: "agent", provider: target.provider };
        } else if (target.kind === "starter") {
          // First message: create a personal assistant Bot; its home folder is its own Project.
          project = {
            id: "personal-home",
            hostId: ctx.host.id,
            name: "Personal assistant",
            path: "~/.clisbot/bots/personal-assistant",
            usedAgo: 0,
            botHome: true,
          };
          S.projects.push(project);
          S.bots.push({
            id: "personal",
            name: "Personal assistant",
            initials: "PA",
            hostId: ctx.host.id,
            projectId: project.id,
            provider: target.provider,
          });
          target = { kind: "bot", botId: "personal" };
        }
        const s = {
          id: `n${Date.now()}`,
          kind: target.kind === "bot" ? "chat" : "agent",
          botId: target.botId,
          provider: target.provider,
          title: text.length > 52 ? `${text.slice(0, 50)}…` : text,
          preview: "Working…",
          projectId: project?.id,
          hostId: ctx.host.id,
          status: "running",
          ago: 0,
        };
        S.sessions.unshift(s);
        S.recentIds = [s.id];
        S.memory.last = { hostId: ctx.host.id, projectId: project?.id, target };
        if (project && !project.botHome) S.memory.byHost[ctx.host.id] = project.id;
        ctx.host.usedAgo = 0;
        if (project) project.usedAgo = 0;
        S.draft = "";
        S.pick = null;
        S.target = null;
        S.dismissed = {};
        H.toast(`Started on ${H.hostLabel(ctx.host)} › ${project?.name}`, s.id);
        H.later(2600, () => {
          s.status = "idle";
          s.preview = "Replied · open to continue";
        });
      };
      H.toast = (text, sessionId) => {
        H.S.toast = { text, sessionId };
        clearTimeout(H.toastTimer);
        H.toastTimer = setTimeout(() => {
          H.S.toast = null;
          H.render();
        }, 3800);
      };

      /* oxlint-disable no-nested-ternary, complexity -- prototype view templates read as one expression per state. */
      /* Product chrome and shared Home parts: sidebar, header, composer, pickers, sheets, setup. */
      const { icon: I, esc: E } = H;
      const U = (H.ui = {});

      // ---------- Small parts ----------
      U.statusPill = (s) => {
        const h = H.host(s.hostId);
        if (h && h.status === "offline")
          return `<span class="pill">${I("offline", "sm")} Host offline</span>`;
        return (
          {
            needs: '<span class="pill warn"><span class="dot warn"></span>Needs you</span>',
            running: '<span class="pill run"><span class="dot run"></span>Running</span>',
            failed: '<span class="pill danger">Failed</span>',
          }[s.status] || ""
        );
      };
      U.who = (s) =>
        s.kind === "chat"
          ? `<span class="ri" title="Chat">${E(H.bot(s.botId)?.initials || "B")}</span>`
          : `<span class="ri" title="Agent session">${H.pv(s.provider)}</span>`;
      U.meta = (s) => {
        const p = H.project(s.projectId);
        const h = H.host(s.hostId);
        const where = p?.botHome ? "" : p?.scratch ? "Quick chat · " : `${E(p?.name || "")} · `;
        return `${where}${E(h ? H.hostLabel(h) : "")} · ${E(H.sessionWho(s))}`;
      };
      U.sessionRow = (s, opts = {}) => `
  <button class="row ${H.S.recentIds.includes(s.id) ? "new" : ""}" data-a="open-session" data-id="${s.id}">
    ${U.who(s)}
    <span class="grow"><span class="rt ell" style="display:block">${E(s.title)}</span>
      <span class="rm ell" style="display:block">${opts.preview ? `${E(s.preview)} · ` : ""}${U.meta(s)}</span></span>
    <span class="rr">${U.statusPill(s)}<span>${s.status === "running" ? "" : H.ago(s.ago)}</span></span>
  </button>`;
      U.schedRow = (k) => {
        const h = H.host(k.hostId);
        const off = h && h.status !== "online";
        return `<button class="row" data-a="open-schedule" data-id="${k.id}">
    <span class="ri">${I(k.kind === "Heartbeat" ? "pulse" : "automation")}</span>
    <span class="grow"><span class="rt ell" style="display:block">${E(k.name)}</span>
      <span class="rm ell" style="display:block">${E(k.kind)} · ${E(k.target)} · ${E(h ? H.hostLabel(h) : "")}</span></span>
    <span class="rr">${k.paused ? '<span class="pill">Paused</span>' : off ? '<span class="pill warn">Host offline</span>' : `<span>${E(k.day === "Today" ? k.at : `${k.day} ${k.at}`)}</span>`}
      <span>${k.paused ? E(k.day) : E(H.inText(k.inMin))}</span></span>
  </button>`;
      };
      U.attnActions = (a) =>
        ({
          needs: `<button class="btn sm solid" data-a="approve" data-id="${a.s?.id}">Approve</button><button class="btn sm" data-a="open-session" data-id="${a.s?.id}">Open</button>`,
          failed: `<button class="btn sm" data-a="retry" data-id="${a.s?.id}">${I("refresh", "sm")} Retry</button><button class="btn sm ghost" data-a="open-session" data-id="${a.s?.id}">Open</button>`,
          "run-failed": `<button class="btn sm" data-a="open-schedule" data-id="${a.k?.id}">Open run</button>`,
          offline: `<button class="btn sm" data-a="reconnect" data-id="${a.h?.id}">${I("refresh", "sm")} Reconnect</button>`,
        })[a.kind];
      U.attnIcon = (a) =>
        ({
          needs: '<span class="dot warn"></span>',
          failed: '<span class="dot danger"></span>',
          "run-failed": '<span class="dot danger"></span>',
          offline: I("offline", "sm"),
        })[a.kind];

      // ---------- Context: Host › Project, plus why it was chosen ----------
      U.why = (ctx) => {
        const S = H.S;
        const r = ctx.reason;
        const blocked = {
          starting: "Starting on this Mac…",
          probing: "Looking for Clisbot on this computer…",
          "web-missing": "Clisbot isn't running on this computer",
          "web-blocked": "Blocked by the browser",
          "mobile-pair": "Connect a computer to start",
          "all-offline": "Can't reach your computers",
        }[ctx.blocker?.kind];
        if (blocked) return blocked;
        if (r === "bot") return "Bot's own project";
        if (r === "picked") return "Chosen for this draft";
        if (r === "last") return `Last used ${H.ago(ctx.project?.usedAgo ?? 0)} ago`;
        if (r === "first")
          return H.isLocal(ctx.host)
            ? S.device === "web"
              ? "Found on this computer"
              : "Runs on this computer"
            : "Your connected computer";
        if (r === "host-offline") return `${E(ctx.notice?.from?.name || "Last host")} is offline`;
        if (r === "project-gone") return "Last project was removed";
        return "";
      };
      U.hostChip = (ctx, cls = "ctx-btn") => {
        const h = ctx.host;
        if (!h) {
          const web = H.S.device === "web";
          return `<button class="${cls}" data-a="pop" data-pop="host" data-anchor="host">${I(web ? "monitor" : "server")}<span class="ell">${web ? "This computer" : "No computer yet"}</span><span class="dot ${web ? "warn" : "off"}"></span>${I("down", "sm")}</button>`;
        }
        const st = h.status === "online" ? "ok" : h.status === "offline" ? "off" : "warn";
        const locked = ctx.reason === "bot";
        return `<button class="${cls}" data-a="${locked ? "pop" : "pop"}" data-pop="host" data-anchor="host" title="${E(H.hostVia(h))}">
    ${I(H.hostIcon(h))}<span class="ell">${E(H.hostLabel(h))}</span><span class="dot ${st}"></span>${I("down", "sm")}</button>`;
      };
      U.projectChip = (ctx, cls = "ctx-btn") => {
        if (ctx.reason === "bot")
          return `<span class="${cls} locked">${I("bot")}<span class="ell">${E(ctx.project?.name)}</span></span>`;
        const label = ctx.project
          ? E(ctx.project.name)
          : ctx.target.kind === "starter"
            ? "Personal assistant <span class=kind>· new</span>"
            : "Choose project";
        return `<button class="${cls}" data-a="pop" data-pop="project" data-anchor="project" ${ctx.host ? "" : "disabled"}>
    ${I(ctx.project ? "folder" : ctx.target.kind === "starter" ? "spark" : "folder")}<span class="ell">${label}</span>${I("down", "sm")}</button>`;
      };
      U.ctxLine = (ctx, opts = {}) => `
  <div class="ctx-line">${opts.label ? `<span class="quiet small">${opts.label}</span>` : ""}
    ${U.hostChip(ctx)}<span class="ctx-sep">›</span>${U.projectChip(ctx)}
    ${opts.why === false ? "" : `<span class="quiet small" style="margin-left:4px">${U.why(ctx)}</span>`}
    ${opts.remote === false ? "" : `<button class="btn ghost sm" style="margin-left:auto" data-a="sheet" data-sheet="pair">${I("plus", "sm")} Connect a computer</button>`}
  </div>`;

      // ---------- Composer ----------
      U.targetChip = (ctx) => {
        const t = ctx.target;
        if (t.kind === "bot") {
          const b = H.bot(t.botId);
          return `<button class="c-chip" data-a="pop" data-pop="target" data-anchor="target"><span class="badge pill" style="padding:0 5px">${E(b.initials)}</span>${E(b.name)}${I("down", "sm")}</button>`;
        }
        const p = H.providers[t.provider];
        const label = t.kind === "starter" ? `${p.name} · ${p.model}` : `${p.model}`;
        return `<button class="c-chip" data-a="pop" data-pop="target" data-anchor="target" title="${E(p.name)}">${H.pv(t.provider)}${E(label)}${I("down", "sm")}</button>`;
      };
      U.composer = (ctx, opts = {}) => {
        const S = H.S;
        const blocked = !ctx.canSend;
        const ph =
          opts.placeholder ||

          const h = ctx.host || S.hosts.find(H.online);
          return shell(
            "Add a project",
            `<p class="muted" style="margin:0">Any folder on <b>${E(h ? H.hostLabel(h) : "a host")}</b>: code, docs, research or data.</p><div class="field"><label>Folder</label><input id="newpath" value="~/projects/website"></div>`,
            `<button class="btn" data-a="close">Cancel</button><button class="btn solid" data-a="add-project" ${h ? "" : "disabled"}>Add project</button>`,
          );
        }
        if (kind === "session") {
          const s = S.sessions.find((x) => x.id === id);
          const h = H.host(s.hostId);
          const off = h.status !== "online";
          return shell(
            E(s.title),
            `<dl class="kv"><dt>Type</dt><dd>${s.kind === "chat" ? "Chat" : "Agent session"} · ${E(H.sessionWho(s))}</dd><dt>Project</dt><dd>${E(H.project(s.projectId)?.name)}</dd><dt>Host</dt><dd>${E(H.hostLabel(h))}${off ? " · offline" : ""}</dd><dt>Last</dt><dd>${E(s.preview)}</dd></dl>
      ${off ? `<div class="notice warn">${I("offline")}<div>This session stays on <b>${E(h.name)}</b>. Reconnect it to continue; Home never moves an existing session to another host.</div></div>` : ""}
      ${s.status === "needs" ? `<div class="notice">${I("bell")}<div class="grow"><b>${E(s.ask)}</b><div class="acts"><button class="btn sm solid" data-a="approve" data-id="${s.id}">Approve</button><button class="btn sm" data-a="deny" data-id="${s.id}">Deny</button></div></div></div>` : ""}`,
            off
              ? `<button class="btn solid" data-a="reconnect" data-id="${h.id}">Reconnect ${E(h.name)}</button>`
              : `<button class="btn solid" data-a="open-real" data-id="${s.id}">Open ${s.kind === "chat" ? "chat" : "session"}</button>`,
          );
        }
        if (kind === "schedule") {
          const k = S.schedules.find((x) => x.id === id);
          const h = H.host(k.hostId);
          return shell(
            E(k.name),
            `<dl class="kv"><dt>Type</dt><dd>${E(k.kind)}</dd><dt>When</dt><dd>${E(k.cadence)}</dd><dt>Next</dt><dd>${k.paused ? "Paused" : `${E(k.day)} ${E(k.at)} · ${E(H.inText(k.inMin))}`}</dd><dt>Runs</dt><dd>${E(k.target)} · ${E(k.runIn)}</dd><dt>Project</dt><dd>${E(H.project(k.projectId)?.name)}</dd><dt>Host</dt><dd>${E(H.hostLabel(h))}${h.status === "online" ? "" : " · offline"}</dd><dt>Time zone</dt><dd>Asia/Ho_Chi_Minh (UTC+7)</dd></dl>
      ${k.failed ? `<div class="notice warn">${I("alert")}<div>Last run failed: ${E(k.failed)}</div></div>` : ""}
      ${h.status !== "online" ? `<div class="notice warn">${I("offline")}<div>${E(h.name)} is offline. This run is skipped unless it reconnects in time.</div></div>` : ""}`,
            `<button class="btn" data-a="toggle-pause" data-id="${k.id}">${k.paused ? `${I("play", "sm")} Resume` : `${I("pause", "sm")} Pause`}</button><button class="btn solid" data-a="run-now" data-id="${k.id}" ${h.status === "online" ? "" : "disabled"}>Run now</button>`,
          );
        }
        return "";
      };

      // ---------- Review chrome ----------
      const FILES = [
        ["01-start.html", "01 Start"],
        ["02-hosts.html", "02 Hosts"],
        ["03-inbox.html", "03 Inbox"],
        ["04-home.html", "04 Home · tổng hòa"],
        ["05-app.html", "05 App · tabs + Hub"],
        ["06-home.html", "06 Home = New workspace"],
      ];
      U.review = () => {
        const S = H.S;
        const hash = location.hash;
        return `<div class="review">
    <span class="review-title">Clisbot Home</span>
    <nav class="review-files">${FILES.map(([f, t], i) => `<a href="${f}${hash}" class="${i + 1 === H.concept.num ? "on" : ""}">${t}</a>`).join("")}</nav>
    ${
      H.concept.variants
        ? U.variantSelect()
        : `<label>Trạng thái <select data-change="scenario">${H.scenarios.map((s) => `<option value="${s.id}" ${s.id === S.scenario ? "selected" : ""}>${E(s.label)}</option>`).join("")}</select></label>
    ${H.concept.reviewExtra?.() || ""}`
    }
    <span class="seg">${[
      ["desktop", "monitor", "Desktop"],
      ["web", "globe", "Web"],
      ["mobile", "phone", "Mobile"],
    ]
      .filter(([d]) => !H.concept.devices || H.concept.devices.includes(d))
      .map(
        ([d, i, t]) =>
          `<button class="${S.device === d ? "on" : ""}" data-a="device" data-id="${d}">${I(i, "sm")}${t}</button>`,
      )
      .join("")}</span>
    <span class="spacer"></span>
    <button class="review-btn" data-a="theme">${I(S.theme === "dark" ? "sun" : "moon", "sm")}${S.theme === "dark" ? "Sáng" : "Tối"}</button>
    <button class="review-btn ${S.notes ? "on" : ""}" data-a="notes">${I("notes", "sm")}Ghi chú thiết kế</button>
    <button class="review-btn" data-a="reset">${I("refresh", "sm")}Đặt lại</button>
    <div class="scenario-hint">${I("info", "sm")} ${E(H.currentVariant()?.hint || S.sc.hint)}</div>
  </div>`;
      };

      // A concept may offer a few curated variants (scenario per device + Hub) instead of every scenario.
      H.currentVariant = () =>
        H.concept.variants?.find(
          (v) => Object.values(v.scenario).includes(H.S.scenario) && v.hub === H.S.hub,
        );
      H.seedVariant = (v, device) => {
        const S = H.S;
        H.seed(v.scenario[device] || v.scenario.desktop, {
          device,
          theme: S.theme,
          notes: S.notes,
          hub: v.hub,
        });
      };
      U.variantSelect = () => {
        const cur = H.currentVariant();
        return `<label>Biến thể <select data-change="variant">${H.concept.variants.map((v) => `<option value="${v.id}" ${cur?.id === v.id ? "selected" : ""}>${E(v.label)}</option>`).join("")}</select></label>`;
      };

      /* oxlint-disable no-nested-ternary, complexity -- prototype view templates read as one expression per state. */
      /* 02 · Hosts — start from the computer. Pick a Host card, then a Project, then type. Everything below is scoped to that Host. */
      (() => {
        const { icon: I, esc: E, ui: U } = H;
        const localPending = () =>
          ({
            probing: ["Looking for Clisbot…", "loader"],
            missing: ["Clisbot isn't running", "alert"],
            blocked: ["Blocked by the browser", "lock"],
            starting: ["Starting…", "loader"],
          })[H.S.local];
        const hostCard = (h, ctx) => {
          const sel = ctx.host?.id === h.id;
          const S = H.S;
          const ss = S.sessions.filter((s) => s.hostId === h.id);
          const needs = ss.filter((s) => s.status === "needs").length;
          const running = ss.filter((s) => s.status === "running").length;
          const ready = H.readyProviders(h);
          const on = h.status === "online";
          const status = on
            ? '<span class="pill ok"><span class="dot ok"></span>Online</span>'
            : h.status === "connecting"
              ? `<span class="pill">${I("loader", "sm spin")} Connecting</span>`
              : h.status === "starting"
                ? `<span class="pill">${I("loader", "sm spin")} Starting</span>`
                : '<span class="pill"><span class="dot off"></span>Offline</span>';
          return `<button class="c2-host ${sel ? "sel" : ""} ${on ? "" : "off"}" data-a="${on ? "pick-host" : "noop"}" data-id="${h.id}">
      <span class="c2-host-top">${I(H.hostIcon(h))}<span class="grow ell"><b>${E(H.hostLabel(h))}</b></span>${status}</span>
      <span class="rm ell">${H.isLocal(h) ? `${E(h.name)} · ` : ""}${E(H.hostVia(h))}${on ? "" : ` · last seen ${E(h.lastSeen || "—")}`}</span>
      <span class="c2-host-foot">${
        on
          ? `<span class="c2-pv">${ready.map((p) => H.pv(p)).join("") || '<span class="pill warn">No agent ready</span>'}</span><span class="grow"></span>${needs ? `<span class="pill warn">${needs} need${needs > 1 ? "" : "s"} you</span>` : ""}${running ? `<span class="pill run">${running} running</span>` : ""}`
          : h.status === "offline"
            ? `<span class="btn sm" data-a="reconnect" data-id="${h.id}">${I("refresh", "sm")} Reconnect</span>`
            : ""
      }</span>
    </button>`;
        };
        const pendingLocal = () => {
          const p = localPending();
          if (!p || H.S.local === "starting") return "";
          return `<div class="c2-host off sel"><span class="c2-host-top">${I("monitor")}<span class="grow ell"><b>This computer</b></span></span><span class="rm">localhost:6767</span>
      <span class="c2-host-foot"><span class="pill ${p[1] === "loader" ? "" : "warn"}">${I(p[1], `sm ${p[1] === "loader" ? "spin" : ""}`)} ${p[0]}</span><span class="grow"></span>${H.S.local === "probing" ? "" : `<span class="btn sm" data-a="probe">${I("refresh", "sm")} Look again</span>`}</span></div>`;
        };
        const strip = (ctx) => {
          const S = H.S;
          const hosts = [...S.hosts].sort(
            (a, b) => H.isLocal(b) - H.isLocal(a) || (a.usedAgo ?? 1e9) - (b.usedAgo ?? 1e9),
          );
          return `<section><div class="sec-h"><h2>Run on</h2><span class="sub">${S.hosts.length ? "New messages go to the selected computer" : "Connect a computer to run agents"}</span><div class="right"><button class="btn ghost sm" data-a="sheet" data-sheet="hosts">Manage</button></div></div>
      <div class="c2-strip">${pendingLocal()}${hosts.map((h) => hostCard(h, ctx)).join("")}
      <button class="c2-host add" data-a="sheet" data-sheet="pair">${I("plus")}<b>Connect a computer</b><span class="rm">${H.compact ? "Scan the QR code from Pair Device" : "Pairing link, address or SSH"}</span></button></div></section>`;
        };
        const projectTabs = (ctx) => {
          if (!ctx.host || ctx.reason === "bot")
            return ctx.reason === "bot"
              ? `<div class="c2-projects"><span class="c2-proj on">${I("bot", "sm")} ${E(ctx.project?.name)} <span class="quiet">· bot's own folder</span></span><button class="link" data-a="target-agent">Use an agent instead</button></div>`
              : "";
          const list = H.projectsOn(ctx.host.id);
          return `<div class="c2-projects"><span class="quiet small">Project</span>
      ${list.map((p) => `<button class="c2-proj ${ctx.project?.id === p.id ? "on" : ""}" data-a="pick-project" data-id="${p.id}">${I("folder", "sm")}${E(p.name)}</button>`).join("")}
      <button class="c2-proj ${ctx.target.kind === "starter" ? "on" : ""}" data-a="pick-personal">${I("spark", "sm")}No project · assistant</button>
      <button class="c2-proj add" data-a="sheet" data-sheet="add-project">${I("plus", "sm")}Add</button></div>`;
        };
        const checklist = (ctx) => {
          const S = H.S;
          if (S.sessions.length || !ctx.host || ctx.blocker?.kind === "providers") return "";
          const h = ctx.host;
          const ready = H.readyProviders(h);
          const steps = [
            [
              h.status === "online",
              H.isLocal(h) ? `${H.hostLabel(h)} is connected` : `${h.name} is connected`,
              H.isLocal(h)
                ? "Clisbot runs here; your code stays on this computer."
                : `Over ${H.hostVia(h)}.`,
            ],
            [
              ready.length > 0,
              `${ready.map((p) => H.providers[p].name).join(", ")} ready`,
              "Found the agents already installed on this computer.",
            ],
            [
              false,
              "Send your first message",
              ctx.target.kind === "starter"
                ? "Starts a Personal assistant with its own folder. Pick a project to work on code."
                : `Starts an agent session in ${ctx.project?.name}.`,
            ],
          ];
          return `<div class="c2-check">${steps.map(([done, t, d], i) => `<div class="step ${done ? "done" : "now"}"><span class="n">${done ? I("check", "sm") : i + 1}</span><div><div class="st">${E(t)}</div><div class="sd">${E(d)}</div></div></div>`).join("")}</div>`;
        };
        const col = (title, sub, items, empty) =>
          `<div class="c2-col"><div class="sec-h"><h2>${title}</h2><span class="sub">${sub}</span></div>${items || `<div class="empty">${empty}</div>`}</div>`;
        const board = () => {
          const S = H.S;
          if (!S.sessions.length && !S.schedules.length) return "";
          const att = H.attention().filter((a) => a.kind !== "offline");
          const running = S.sessions.filter((s) => s.status === "running");
          const next = H.upcoming()
            .filter((k) => !k.paused)
            .slice(0, 4);
          const card = (a) =>
            `<div class="c2-att">${U.attnIcon(a)}<div class="grow"><div class="rt ell">${E(a.title)}</div><div class="rm">${E(a.text)}</div><div class="rm">${a.s ? `${E(H.hostLabel(H.host(a.s.hostId)))} · ${H.ago(a.ago)}` : ""}</div><div class="acts">${U.attnActions(a)}</div></div></div>`;
          const tab = S.c2tab || "needs";
          const cols = {
            needs: col(
              "Needs you",
              att.length ? `${att.length}` : "",
              att.map(card).join(""),
              "Nothing waiting on you",
            ),
            running: col(
              "Running",
              running.length ? `${running.length}` : "",
              running.length
                ? `<div class="rows">${running.map((s) => U.sessionRow(s, { preview: true })).join("")}</div>`
                : "",
              "No agent is working right now",
            ),
            next: col(
              "Up next",
              "",
              next.length ? `<div class="rows">${next.map(U.schedRow).join("")}</div>` : "",
              "No schedules",
            ),
          };
          if (H.compact)
            return `<section><span class="tabs c2-tabs">${[
              ["needs", `Needs you${att.length ? ` · ${att.length}` : ""}`],
              ["running", "Running"],
              ["next", "Up next"],
            ]
              .map(
                ([k, t]) =>
                  `<button class="${tab === k ? "on" : ""}" data-a="c2-tab" data-id="${k}">${t}</button>`,
              )
              .join("")}</span>${cols[tab]}</section>`;
          return `<section class="c2-board">${cols.needs}${cols.running}${cols.next}</section>`;
        };
        const recent = (ctx) => {
          const S = H.S;
          if (!S.sessions.length) return "";
          const scope = S.c2scope || "host";
          const list = H.recent()
            .filter((s) => scope === "all" || s.hostId === ctx.host?.id)
            .slice(0, 6);
          return `<section><div class="sec-h"><h2>Recent</h2><div class="right"><span class="tabs">${[
            ["host", ctx.host ? `On ${H.hostLabel(ctx.host)}` : "This host"],
            ["all", "All computers"],
          ]
            .map(
              ([k, t]) =>
                `<button class="${scope === k ? "on" : ""}" data-a="c2-scope" data-id="${k}">${E(t)}</button>`,
            )
            .join("")}</span></div></div>
      <div class="rows">${list.map((s) => U.sessionRow(s, { preview: true })).join("") || '<div class="empty">No sessions on this computer yet.</div>'}</div></section>`;
        };
        Object.assign(H.actions, {
          "c2-tab"(el) {
            H.S.c2tab = el.dataset.id;
          },
          "c2-scope"(el) {
            H.S.c2scope = el.dataset.id;
          },
        });
        H.concept = {
          num: 2,
          name: "Hosts",
          tagline: "02 · Hosts — bắt đầu từ máy tính",
          render: (ctx) => `<div class="c2">
      ${strip(ctx)}
      ${U.notice(ctx)}
      ${ctx.blocker && !["no-project"].includes(ctx.blocker.kind) ? U.setup(ctx) : ""}
      <section class="c2-compose">${projectTabs(ctx)}${U.composer(ctx, { rows: 3 })}${U.starterHint(ctx)}${ctx.blocker?.kind === "no-project" ? U.setup(ctx) : ""}</section>
      ${checklist(ctx)}${board()}${recent(ctx)}</div>`,
          notes: `<h2>02 · Hosts</h2>
      <p><b>Ý tưởng:</b> Agent chạy trên máy tính, nên Home bắt đầu từ máy tính. Chọn thẻ Host → chọn Project → gõ. Mọi thứ bên dưới (Running, Recent) được lọc theo Host đang chọn.</p>
      <h3>Bố cục</h3><ul>
      <li><b>Run on</b>: thẻ cho từng Host — máy này đứng đầu (“This Mac · LongPro2Max · Local”), trạng thái, agent sẵn sàng, số việc đang chạy/cần bạn; Host offline có Reconnect ngay trên thẻ; thẻ cuối là <b>Connect a computer</b>.</li>
      <li>Hàng Project dạng tab của Host đó + “No project · assistant” + Add.</li>
      <li>Composer, rồi bảng 3 cột: <b>Needs you / Running / Up next</b>; cuối là <b>Recent</b> (máy này ↔ tất cả).</li>
      <li>Mobile: thẻ Host cuộn ngang; bảng 3 cột thành tab.</li></ul>
      <h3>Host &amp; lần đầu</h3><ul>
      <li>Lần đầu Desktop: thẻ máy này đã chọn + checklist 3 bước (đã kết nối ✓, agent sẵn sàng ✓, gửi tin đầu tiên).</li>
      <li>Web: thẻ “This computer” hiện đúng trạng thái dò/không thấy/bị chặn và “Look again”. Mobile: chỉ có thẻ Connect + 3 bước ghép nối.</li></ul>
      <h3>Mạnh</h3><ul><li>Không bao giờ nhầm tin nhắn chạy ở đâu; kết nối Host là thao tác hạng nhất.</li><li>Hợp người dùng nhiều máy/server, theo dõi từ điện thoại.</li></ul>
      <h3>Đánh đổi</h3><ul><li>Composer bị đẩy xuống dưới hàng Host — chat không còn “chính diện” tuyệt đối.</li><li>Người chỉ có một máy thấy thêm một tầng không cần thiết.</li></ul>`,
        };
      })();

      /* oxlint-disable no-nested-ternary, complexity -- prototype view templates read as one expression per state. */
      /* Render loop, delegated actions and keyboard. Concepts only supply the Home body. */
      H.render = () => {
        const S = H.S;
        const root = document.getElementById("root");
        const active = document.activeElement;
        const focusId = active?.id;
        const sel =
          focusId && typeof active.selectionStart === "number"
            ? [active.selectionStart, active.selectionEnd]
            : null;
        const scrollTop = root.querySelector(".body")?.scrollTop || 0;
        H.compact = S.device === "mobile" || window.innerWidth < 760;
        document.body.className = S.theme === "dark" ? "dark" : "";
        const ctx = H.resolve();
        const C = H.concept;
        const overlay = S.pop || S.sheet;
        root.innerHTML = `${H.ui.review()}<div class="stage">
    <div class="frame ${H.compact ? "mobile" : ""}"><div class="app">
      ${H.compact ? "" : C.sidebar?.(ctx) || H.ui.sidebar()}
      <main class="main">${C.header?.(ctx) || H.ui.header(C.headerExtra?.(ctx) || "")}<div class="body">${C.render(ctx)}</div>${C.bottom?.(ctx) || ""}</main>
      ${overlay ? `<div class="scrim ${S.sheet || H.compact ? "dim" : ""}" data-a="close"></div>` : ""}
      ${S.pop ? `<div class="pop" role="menu">${H.ui.pop(ctx)}</div>` : ""}
      ${S.sheet ? H.ui.sheet(ctx) : ""}
      ${S.toast ? `<div class="toast" role="status">${H.esc(S.toast.text)}${S.toast.sessionId ? ` <button class="link" data-a="open-session" data-id="${S.toast.sessionId}">Open</button>` : ""}</div>` : ""}
    </div></div>
    ${S.notes ? `<aside class="notes">${C.notes}</aside>` : ""}
  </div>`;
        const body = root.querySelector(".body");
        if (body) body.scrollTop = scrollTop;
        if (S.pop && !H.compact) placePop();
        if (focusId) {
          const el = document.getElementById(focusId);
          if (el) {
            el.focus();
            if (sel) el.setSelectionRange(...sel);
          }
        }
        autosize();
      };
      function placePop() {
        const frame = document.querySelector(".frame");
        const pop = document.querySelector(".pop");
        const anchor = frame.querySelector(`[data-anchor="${H.S.pop.anchor}"]`);
        if (!anchor || !pop) return;
        const f = frame.getBoundingClientRect();
        const a = anchor.getBoundingClientRect();
        const below = a.bottom - f.top + 6;
        const fitsBelow = below + pop.offsetHeight < f.height - 8;
        pop.style.top = `${fitsBelow ? below : Math.max(8, a.top - f.top - pop.offsetHeight - 6)}px`;
        pop.style.left = `${Math.min(Math.max(8, a.left - f.left), f.width - pop.offsetWidth - 8)}px`;
      }
      function autosize() {
        const t = document.getElementById("draft");
        if (!t) return;
        t.style.height = "auto";
        t.style.height = `${Math.min(t.scrollHeight, 220)}px`;
      }

      // ---------- Actions ----------
      const A = H.actions;
      const S_ = () => H.S;
      Object.assign(A, {
        noop() {},
        close() {
          S_().pop = null;
          S_().sheet = null;
        },
        pop(el) {
          const S = S_();
          S.sheet = null;
          S.pop =
            S.pop?.kind === el.dataset.pop
              ? null
              : { kind: el.dataset.pop, anchor: el.dataset.anchor };
        },
        sheet(el) {
          const S = S_();
          S.pop = null;
          S.sheet = el.dataset.sheet;
          if (S.sheet === "pair")
            S.pair = { method: el.dataset.method || (H.compact ? "qr" : "link"), state: "idle" };
        },
        "pick-host"(el) {
          const S = S_();
          const h = H.host(el.dataset.id);
          const last = S.memory.byHost[h.id];
          S.pick = {
            hostId: h.id,
            projectId: H.project(last) ? last : H.projectsOn(h.id)[0]?.id || null,
          };
          if (S.target?.kind === "bot" || S.memory.last?.target?.kind === "bot")
            S.target = { kind: "agent", provider: H.readyProviders(h)[0] || "claude" };
          S.pop = null;
        },
        "pick-project"(el) {
          const S = S_();
          const p = H.project(el.dataset.id);
          S.pick = { hostId: p.hostId, projectId: p.id };
          const ctx = H.resolve();
          if (ctx.target.kind !== "agent")
            S.target = {
              kind: "agent",
              provider: H.readyProviders(H.host(p.hostId))[0] || "claude",
            };
          S.pop = null;
        },
        "pick-personal"() {
          const S = S_();
          const ctx = H.resolve();
          S.pick = { hostId: ctx.host.id, projectId: null };
          S.target = { kind: "starter" };
          S.pop = null;
        },
        "pick-provider"(el) {
          const S = S_();
          const ctx = H.resolve();
          if (ctx.reason === "bot")
            S.pick = { hostId: ctx.host.id, projectId: H.projectsOn(ctx.host.id)[0]?.id || null };
          S.target = { kind: "agent", provider: el.dataset.id };
          S.pop = null;
        },
        "pick-bot"(el) {
          const S = S_();
          S.target = { kind: "bot", botId: el.dataset.id };
          S.pop = null;
        },
        "target-agent"() {
          const S = S_();
          const h = S.hosts.find(H.online);
          S.target = { kind: "agent", provider: "claude" };
          if (h) S.pick = { hostId: h.id, projectId: H.projectsOn(h.id)[0]?.id || null };
        },
        set(el) {
          S_()[el.dataset.k] = el.dataset.v;
          S_().pop = null;
        },
        dismiss(el) {
          S_().dismissed[el.dataset.id] = true;
        },
        send() {
          H.send();
        },
        focus() {
          S_().pop = null;
          requestAnimationFrame(() => document.getElementById("draft")?.focus());
        },
        attach() {
          H.toast("Attach files (demo): files are uploaded to the chosen host");
        },
        mic() {
          H.toast("Dictation (demo)");
        },
        nav(el) {
          H.toast(`${el.dataset.id} — outside this Home prototype`);
        },
        "open-desktop"() {
          H.toast("Opening Clisbot Desktop… then press Look again");
        },
        download() {
          H.toast("clisbot.com/download");
        },
        copy() {
          H.toast("Copied");
        },
        probe() {
          H.probe(false);
        },
        reconnect(el) {
          H.reconnect(el.dataset.id);
          S_().pop = null;
        },
        "providers-check"() {
          const h = S_().hosts[0];
          h.providers.claude = "ready";
          H.toast("Claude Code is ready on this Mac");
        },
        "open-session"(el) {
          S_().pop = null;
          S_().sheet = `session:${el.dataset.id}`;
        },
        "open-schedule"(el) {
          S_().pop = null;
          S_().sheet = `schedule:${el.dataset.id}`;
        },
        "open-real"(el) {
          const s = S_().sessions.find((x) => x.id === el.dataset.id);
          S_().sheet = null;
          H.toast(`Opens “${s.title}” on its own host`);
        },
        approve(el) {
          const s = S_().sessions.find((x) => x.id === el.dataset.id);
          s.status = "running";
          s.preview = "Approved · running";
          s.ask = null;
          S_().sheet = null;
          H.toast(`Approved · ${s.title}`);
        },
        deny(el) {
          const s = S_().sessions.find((x) => x.id === el.dataset.id);
          s.status = "idle";
          s.preview = "Denied · waiting for you";
          S_().sheet = null;
        },
        retry(el) {
          const s = S_().sessions.find((x) => x.id === el.dataset.id);
          s.status = "running";
          s.preview = "Retrying…";
          H.toast(`Retrying ${s.title}`);
        },
        "toggle-pause"(el) {
          const k = S_().schedules.find((x) => x.id === el.dataset.id);
          k.paused = !k.paused;
        },
        "run-now"(el) {
          const k = S_().schedules.find((x) => x.id === el.dataset.id);
          S_().sheet = null;
          H.toast(`Running ${k.name} now`);
        },
        "pair-method"(el) {
          S_().pair = { method: el.dataset.id, state: "idle" };
        },
        "pair-expire"() {
          S_().pair.state = "error";
        },
        "pair-go"() {
          S_().pair.state = "busy";
          H.later(1200, () => H.pairDone());
        },
        "add-project"() {
          const S = S_();
          const h = H.resolve().host || S.hosts.find(H.online);
          const path = document.getElementById("newpath")?.value || "~/projects/website";
          const p = {
            id: `p${Date.now()}`,
            hostId: h.id,
            name: path.split("/").findLast(Boolean),
            path,
            usedAgo: 0,
          };
          S.projects.push(p);
          S.pick = { hostId: h.id, projectId: p.id };
          if (H.resolve().target.kind !== "agent")
            S.target = { kind: "agent", provider: H.readyProviders(h)[0] || "claude" };
          S.sheet = null;
          H.toast(`Added ${p.name}`);
        },
        filter(el) {
          S_().filter = el.dataset.id;
        },
        starter(el) {
          const S = S_();
          S.draft = S.draft.trim() ? `${S.draft.trim()}\n${el.dataset.text}` : el.dataset.text;
          requestAnimationFrame(() => {
            const t = document.getElementById("draft");
            t?.focus();
            t?.setSelectionRange(t.value.length, t.value.length);
          });
        },
        // Review chrome
        device(el) {
          const S = S_();
          if (H.concept.variants) {
            H.seedVariant(H.currentVariant() || H.concept.variants[0], el.dataset.id);
            H.saveUi();
            return;
          }
          const scenario = S.sc.device && S.sc.device !== el.dataset.id ? "returning" : S.scenario;
          H.seed(scenario, { device: el.dataset.id, theme: S.theme, notes: S.notes });
          H.saveUi();
        },
        theme() {
          S_().theme = S_().theme === "dark" ? "light" : "dark";
          H.saveUi();
        },
        notes() {
          S_().notes = !S_().notes;
          H.saveUi();
        },
        reset() {
          const S = S_();
          H.seed(S.scenario, { device: S.device, theme: S.theme, notes: S.notes });
        },
      });

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-a]");
        if (!el || el.disabled) return;
        const fn = H.actions[el.dataset.a];
        if (!fn) return;
        e.preventDefault();
        e.stopPropagation();
        fn(el, e);
        H.render();
      });
      document.addEventListener("change", (e) => {
        if (e.target.dataset.change === "scenario") {
          const sc = H.scenarios.find((s) => s.id === e.target.value);
          H.seed(sc.id, { device: sc.device || H.S.device, theme: H.S.theme, notes: H.S.notes });
          H.saveUi();
          H.render();
        }
        if (e.target.dataset.change === "variant") {
          H.seedVariant(
            H.concept.variants.find((v) => v.id === e.target.value),
            H.S.device,
          );
          H.saveUi();
          H.render();
        }
        if (e.target.dataset.change === "hub") {
          const S = H.S;
          H.seed(S.scenario, {
            device: S.device,
            theme: S.theme,
            notes: S.notes,
            hub: e.target.value,
          });
          H.saveUi();
          H.render();
        }
      });
      document.addEventListener("input", (e) => {
        // Search fields bind to one state key and re-render; render() keeps focus and caret.
        if (e.target.dataset.model) {
          H.S[e.target.dataset.model] = e.target.value;
          H.render();
          return;
        }
        if (e.target.id !== "draft") return;
        H.S.draft = e.target.value;
        const send = document.getElementById("send");
        if (send) send.disabled = !H.resolve().canSend || !H.S.draft.trim();
        autosize();
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.id === "draft" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          H.send();
          H.render();
          return;
        }
        if (e.key === "Escape" && (H.S.pop || H.S.sheet)) {
          A.close();
          H.render();
          return;
        }
        const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
        if (!typing && e.key === "/") {
          e.preventDefault();
          document.getElementById("draft")?.focus();
        }
      });
      let resizeRaf;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(H.render);
      });
      window.addEventListener("DOMContentLoaded", () => {
        H.load();
        H.render();
      });
    </script>
  </body>
</html>
