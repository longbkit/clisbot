              return `<button data-action="starter" data-id="${id}" class="quick-start ${HOME.state.focusedStarter === id ? "selected" : ""}">${HOME.icon(s.icon)}<span><strong>${s.title}</strong><small>${s.subtitle}</small></span>${HOME.icon("right")}</button>`;
            })
            .join("")}</div></section>`;
        }),
        (HOME.view.session = (s) => {
          const host = HOME.state.hosts.find((h) => h.id === s.host);
          return `<button class="session-row" data-action="session" data-id="${s.id}"><span class="session-mark ${s.color}">${s.type === "chat" ? HOME.esc(s.avatar) : HOME.providerIcon(s.provider)}</span><span class="session-body"><span class="session-top"><strong>${HOME.esc(s.title)}</strong><span class="session-type">${s.type === "chat" ? "Chat" : "Agent session"}</span></span><span class="session-preview">${HOME.esc(s.preview)}</span><span class="session-meta">${HOME.esc(HOME.projects[s.project].name)} \xB7 ${host?.local ? "Local" : HOME.esc(host?.name || "Host kh\xF4ng kh\u1EA3 d\u1EE5ng")} \xB7 ${HOME.esc(s.type === "chat" ? s.bot : s.provider)}</span></span><span class="session-tail">${HOME.view.status(s)}<small>${s.time === "\u0110ang ch\u1EA1y" ? "V\u1EEBa c\u1EADp nh\u1EADt" : s.time}</small></span>${HOME.icon("right")}</button>`;
        }),
        (HOME.view.recentFilters = () =>
          `<div class="recent-toolbar"><div class="filters" role="group" aria-label="Lo\u1EA1i session">${[
            ["all", "T\u1EA5t c\u1EA3"],
            ["chat", "Chat"],
            ["agent", "Agent session"],
          ]
            .map(
              ([id, label]) =>
                `<button data-action="filter" data-id="${id}" class="${HOME.state.filter === id ? "active" : ""}" aria-pressed="${HOME.state.filter === id}">${label}</button>`,
            )
            .join(
              "",
            )}</div>${[2, 4].includes(HOME.direction) ? `<button class="scope-toggle" data-action="activity-scope">${HOME.icon("project")}${HOME.state.activityScope === "project" ? "Project n\xE0y" : "M\u1ECDi Project"}${HOME.icon("down")}</button>` : `<button class="icon-button" data-action="search" aria-label="T\xECm session">${HOME.icon("search")}</button>`}</div>`),
        (HOME.view.recent = () => {
          const sessions = HOME.directionSessions(),
            limit = HOME.direction === 3 ? 3 : 4,
            visible = sessions.slice(0, HOME.state.showAll ? 20 : limit);
          let body = visible.map(HOME.view.session).join("");
          return (
            HOME.direction === 2 &&
              visible.length &&
              (body = [...new Set(visible.map((s) => `${s.host}:${s.project}`))]
                .map((key) => {
                  const [host, project] = key.split(":"),
                    h = HOME.state.hosts.find((v) => v.id === host);
                  return `<div class="project-session-group"><div class="project-group-heading">${HOME.view.projectMark(project)}<strong>${HOME.esc(HOME.projects[project].name)}</strong><span>${h?.local ? "Local \xB7 M\xE1y n\xE0y" : HOME.esc(h?.name || "Host kh\xF4ng kh\u1EA3 d\u1EE5ng")}</span></div>${visible
                    .filter((s) => s.host === host && s.project === project)
                    .map(HOME.view.session)
                    .join("")}</div>`;
                })
                .join("")),
            visible.length ||
              (body = HOME.view.empty(
                "chat",
                "S\u1EB5n s\xE0ng cho vi\u1EC7c \u0111\u1EA7u ti\xEAn",
                HOME.state.activityScope === "project"
                  ? "Ch\u01B0a c\xF3 session trong Project n\xE0y. Anh c\xF3 th\u1EC3 b\u1EAFt \u0111\u1EA7u m\u1EDBi ho\u1EB7c xem m\u1ECDi Project."
                  : "Chat v\xE0 Agent session c\u1EE7a anh s\u1EBD xu\u1EA5t hi\u1EC7n \u1EDF \u0111\xE2y.",
                "focus-prompt",
                "Vi\u1EBFt tin nh\u1EAFn",
              )),
            HOME.isLoading() && (body = '<div class="skeleton"></div><div class="skeleton"></div>'),
            `<section class="recent-area"><div class="section-header"><div><h2>${HOME.direction === 3 ? "Ti\u1EBFp t\u1EE5c c\xF4ng vi\u1EC7c" : "G\u1EA7n \u0111\xE2y"}</h2><div class="section-subtitle">${HOME.direction === 2 ? "Nh\xF3m theo Host v\xE0 Project" : "Chat v\xE0 Agent session tr\xEAn c\xE1c Host c\u1EE7a anh"}</div></div><button class="text-action" data-action="history">Xem t\u1EA5t c\u1EA3 ${HOME.icon("right")}</button></div>${HOME.view.recentFilters()}${HOME.state.query ? `<div class="query-label">T\xECm \u201C${HOME.esc(HOME.state.query)}\u201D <button data-action="clear-search">X\xF3a l\u1ECDc</button></div>` : ""}<div class="direction-sessions">${body}</div>${sessions.length > visible.length ? '<button class="more-sessions" data-action="show-all">Xem th\xEAm session \u2193</button>' : ""}</section>`
          );
        }),
        (HOME.view.attention = (options = {}) => {
          if (HOME.isLoading()) return "";
          const waiting = HOME.state.sessions.filter(
              (s) =>
                s.status === "attention" && HOME.state.hosts.find((h) => h.id === s.host)?.online,
            ),
            rows = options.skipPriority ? waiting.slice(1) : waiting,
            down = HOME.state.hosts.filter((h) => !h.online),
            showDown = down.length && !HOME.isFirst() && HOME.state.scenario !== "localstarting",
            items = rows
              .map(
                (s) =>
                  `<button class="attention-action" data-action="session" data-id="${s.id}"><span class="attention-symbol">${HOME.icon("chat")}</span><span><strong>${HOME.esc(s.title)}</strong><small>${s.provider} \xB7 c\u1EA7n anh xem \u0111\u1EC1 xu\u1EA5t</small><em>M\u1EDF \u0111\u1EC3 ph\u1EA3n h\u1ED3i ${HOME.icon("right")}</em></span></button>`,
              )
              .join(""),
            offline = showDown
              ? `<button class="attention-action offline-action" data-action="hosts"><span class="attention-symbol">${HOME.icon("host")}</span><span><strong>${down.length} Host \u0111ang offline</strong><small>${down.map((h) => HOME.esc(h.name)).join(", ")}</small><em>Ki\u1EC3m tra k\u1EBFt n\u1ED1i ${HOME.icon("right")}</em></span></button>`
              : "";
          return `<section class="attention-card"><div class="attention-heading">${HOME.icon(rows.length ? "bell" : "check")}${HOME.direction === 3 ? "C\u1EA7n ph\u1EA3n h\u1ED3i" : "C\u1EA7n ch\xFA \xFD"}${rows.length ? `<span class="count">${rows.length}</span>` : ""}</div>${items}${offline}${!items && !offline ? '<div class="all-clear">M\u1ECDi th\u1EE9 \u0111ang \u1ED5n.<small>Vi\u1EC7c c\u1EA7n ph\u1EA3n h\u1ED3i s\u1EBD xu\u1EA5t hi\u1EC7n \u1EDF \u0111\xE2y.</small></div>' : ""}</section>`;
        }),
        (HOME.view.priority = () => {
          const item = HOME.state.sessions.find(
            (s) =>
              s.status === "attention" && HOME.state.hosts.find((h) => h.id === s.host)?.online,
          );
          return item
            ? `<button class="priority-inline" data-action="session" data-id="${item.id}">${HOME.icon("bell")}<span><strong>\u0110ang ch\u1EDD anh</strong> ${HOME.esc(item.title)}</span><span class="priority-cta">Xem \u0111\u1EC1 xu\u1EA5t ${HOME.icon("right")}</span></button>`
            : "";
        }),
        (HOME.view.scheduleRow = (s) => {
          const host = HOME.state.hosts.find((h) => h.id === s.host);
          let next = HOME.esc(s.relative);
          return (
            host?.online || (next = "Host offline \xB7 c\u1EA7n k\u1EBFt n\u1ED1i l\u1EA1i"),
            s.paused && (next = "T\u1EA1m d\u1EEBng"),
            `<button class="schedule-row" data-action="schedule" data-id="${s.id}"><span class="schedule-time">${HOME.esc(s.time)}</span><span class="schedule-copy"><strong>${HOME.esc(s.title)}</strong><span class="schedule-meta">${HOME.esc(HOME.projects[s.project].name)} \xB7 ${host?.local ? "Local" : HOME.esc(host?.name || "Host kh\xF4ng kh\u1EA3 d\u1EE5ng")}</span><span class="schedule-next"><span class="schedule-label">${s.type}</span>${next}</span></span>${HOME.icon("right")}</button>`
          );
        }),
        (HOME.view.schedules = () => {
          const items = HOME.state.schedules.filter((s) => !s.paused),
            body = ["H\xF4m nay", "Ng\xE0y mai"]
              .map((day) => {
                const group = items
                  .filter((s) => s.day === day)
                  .sort((a, b) => a.time.localeCompare(b.time));
                return group.length
                  ? `<div class="schedule-group">${day}<small>Asia/Ho_Chi_Minh \xB7 UTC+7</small></div>${group.map(HOME.view.scheduleRow).join("")}`
                  : "";
              })
              .join("");
          return `<section class="schedule-section"><div class="section-header"><div><h2>S\u1EAFp ch\u1EA1y ti\u1EBFp theo</h2><div class="section-subtitle">Schedule v\xE0 Heartbeat</div></div><button class="icon-button" data-action="new-schedule" aria-label="T\u1EA1o l\u1ECBch">${HOME.icon("plus")}</button></div><div class="schedule-card">${HOME.isLoading() ? '<div class="skeleton"></div>' : body || HOME.view.empty("clock", "Ch\u01B0a c\xF3 l\u1ECBch", "H\u1EB9n m\u1ED9t c\xF4ng vi\u1EC7c \u0111\u1ECBnh k\u1EF3 khi anh c\u1EA7n.", "new-schedule", "T\u1EA1o l\u1ECBch")}</div><button class="text-action schedule-all" data-action="automations">Xem t\u1EA5t c\u1EA3 l\u1ECBch ${HOME.icon("right")}</button></section>`;
        }),
        (HOME.view.chatDirection = () =>
          `<section class="hero chat-hero" aria-labelledby="home-title">${HOME.view.directionTitle()}${HOME.view.providerBar()}${HOME.view.notice()}${HOME.directionBase.onboarding()}<div class="chat-entry">${HOME.view.contextBand()}${HOME.view.composer()}</div>${HOME.view.quickStarts()}</section><div class="direction-lower chat-lower">${HOME.view.recent()}<aside class="aside-area">${HOME.view.attention()}${HOME.view.schedules()}</aside></div>`),
        (HOME.view.projectDirection = () =>
          `<section class="hero project-hero" aria-labelledby="home-title">${HOME.view.directionTitle()}${HOME.view.hostTiles()}${HOME.view.notice()}${HOME.directionBase.onboarding()}<div class="project-entry"><div class="project-composer">${HOME.view.contextBand()}${HOME.view.providerBar()}${HOME.view.composer()}</div>${HOME.view.workSummary()}</div>${HOME.view.quickStarts()}</section><div class="direction-lower project-lower">${HOME.view.recent()}<div class="project-bottom">${HOME.view.schedules()}${HOME.view.attention()}</div></div>`),
        (HOME.view.todayStats = () => {
          const counts = HOME.directionCounts();
          return `<div class="today-stats"><span class="today-date">${HOME.icon("clock")}Th\u1EE9 S\xE1u, 09 th\xE1ng 10 <small>15:20 \xB7 gi\u1EDD c\u1EE7a anh</small></span>${[
            ["running", counts.running, "\u0111ang ch\u1EA1y"],
            ["attention", counts.attention, "c\u1EA7n ph\u1EA3n h\u1ED3i"],
            ["automations", counts.schedules, "l\u1ECBch s\u1EAFp t\u1EDBi"],
          ]
            .map(
              ([action, count, label]) =>
                `<button data-action="${action}"><strong>${count}</strong>${label}${HOME.icon("right")}</button>`,
            )
            .join("")}</div>`;
        }),
        (HOME.view.todayDirection = () =>
          `<section class="hero today-hero" aria-labelledby="home-title">${HOME.view.directionTitle()}${HOME.view.todayStats()}${HOME.view.notice()}${HOME.directionBase.onboarding()}<div class="today-entry">${HOME.view.contextBand()}${HOME.view.providerBar()}${HOME.view.composer()}</div>${HOME.view.quickStarts()}</section><div class="direction-lower today-lower"><aside class="today-attention">${HOME.view.attention()}</aside>${HOME.view.recent()}${HOME.view.schedules()}</div>`),
        (HOME.view.homeDirection = () =>
          `<section class="hero home-hero" aria-labelledby="home-title">${HOME.view.directionTitle()}${HOME.view.notice()}<div class="home-entry"><div class="home-chat"><div class="entry-heading"><span>${HOME.icon("chat")}B\u1EAFt \u0111\u1EA7u m\u1EDBi</span><span class="saved-draft">${HOME.state.draft ? "B\u1EA3n nh\xE1p \u0111\u01B0\u1EE3c gi\u1EEF" : "Chat v\u1EDBi Bot ho\u1EB7c Agent session"}</span></div>${HOME.view.providerBar()}${HOME.view.composer()}${HOME.view.priority()}${HOME.view.quickStarts()}</div>${HOME.view.hostDock()}</div></section><div class="direction-lower home-lower">${HOME.view.recent()}<aside class="aside-area">${HOME.view.schedules()}${HOME.view.attention({ skipPriority: !0 })}</aside></div>`),
        (HOME.view.footer = () =>
          `<div class="home-footer"><button data-action="new-bot">${HOME.icon("plus")}T\u1EA1o Bot</button><button data-action="connect">${HOME.icon("remote")}Th\xEAm remote Host</button><span class="footer-shortcut">\u2318 K t\xECm ki\u1EBFm \xB7 Enter g\u1EEDi \xB7 Shift + Enter xu\u1ED1ng d\xF2ng</span></div>`),
        (HOME.view.shell = () => {
          const layouts = {
            1: HOME.view.chatDirection,
            2: HOME.view.projectDirection,
            3: HOME.view.todayDirection,
            4: HOME.view.homeDirection,
          };
          return `<div class="app-layout">${HOME.view.sidebar()}<main class="content direction-${HOME.direction}">${HOME.view.topbar()}<div class="direction-canvas">${layouts[HOME.direction]()}${HOME.view.footer()}</div></main></div>${HOME.view.mobileNav()}`;
        }),
        (HOME.view.note = () => {
          const d = HOME.directions[HOME.direction];
          return `<div><div class="note-id">PH\u01AF\u01A0NG \xC1N 0${HOME.direction} \xB7 ${d.tag}</div><h2>${d.name}</h2></div><p>${d.strength} B\u1EA3n HTML t\u01B0\u01A1ng t\xE1c, d\xF9ng d\u1EEF li\u1EC7u v\xE0 k\u1EBFt n\u1ED1i m\xF4 ph\u1ECFng.</p><button data-action="direction-detail">Xem ch\u1EE7 \u0111\xEDch thi\u1EBFt k\u1EBF \u2197</button>`;
        }),
        (HOME.ui.actions["direction-detail"] = () => {
          const d = HOME.directions[HOME.direction],
            synthesis =
              HOME.direction === 4
                ? '<div class="synthesis-notes"><h3>V\xEC sao b\u1EA3n 4 hi\u1EC7u qu\u1EA3 h\u01A1n vi\u1EC7c gh\xE9p c\u1EA3 ba?</h3><p>Chat, k\u1EBFt n\u1ED1i v\xE0 ti\u1EBFp t\u1EE5c c\xF4ng vi\u1EC7c c\xF3 ba v\xF9ng r\xF5 r\xE0ng. Composer lu\xF4n hi\u1EC7n; Host c\xF3 v\xF9ng ri\xEAng \u0111\u1EC3 gi\u1EA3i th\xEDch tr\u1EA1ng th\xE1i. L\u1EA7n \u0111\u1EA7u, v\xF9ng Host m\u1EDF h\u01B0\u1EDBng d\u1EABn; khi \u0111\xE3 s\u1EB5n s\xE0ng, n\xF3 thu g\u1ECDn th\xE0nh ng\u1EEF c\u1EA3nh ki\u1EC3m tra \u0111\u01B0\u1EE3c.</p><p>Ch\u1EC9 m\u1ED9t vi\u1EC7c c\u1EA7n ph\u1EA3n h\u1ED3i \u0111\u01B0\u1EE3c \u0111\u01B0a c\u1EA1nh chat. M\u1ECDi session v\xE0 l\u1ECBch c\xF2n l\u1EA1i \u1EDF ph\xEDa d\u01B0\u1EDBi, v\u1EDBi b\u1ED9 l\u1ECDc Project \u0111\u1ED9c l\u1EADp \u0111\u1EC3 kh\xF4ng l\xE0m thay \u0111\u1ED5i n\u01A1i g\u1EEDi tin nh\u1EAFn m\u1EDBi.</p><p>Local s\u1EB5n s\xE0ng: nh\u1EAFn ngay. Web ch\u01B0a c\xF3 local: h\u01B0\u1EDBng d\u1EABn b\u1EADt Host r\u1ED3i th\u1EED l\u1EA1i. Mobile: h\u01B0\u1EDBng d\u1EABn gh\xE9p n\u1ED1i remote. Fallback ch\u1EC9 \u0111\u1ED5i n\u01A1i b\u1EAFt \u0111\u1EA7u m\u1EDBi; session v\xE0 l\u1ECBch gi\u1EEF Host g\u1ED1c.</p></div>'
                : "";
          HOME.ui.open(
            `0${HOME.direction} \xB7 ${d.name}`,
            "\u0110\u1EC1 xu\u1EA5t Home, gi\u1EEF UI v\xE0 thu\u1EADt ng\u1EEF c\u1EE7a Clisbot hi\u1EC7n t\u1EA1i.",
            `<dl class="detail-grid"><dt>Th\u1EBF m\u1EA1nh</dt><dd>${d.strength}</dd><dt>\u0110\xE1nh \u0111\u1ED5i</dt><dd>${d.tradeoff}</dd><dt>Ng\u1EEF c\u1EA3nh m\u1EDBi</dt><dd>Host / Project g\u1EA7n nh\u1EA5t \u2192 local s\u1EB5n s\xE0ng \u2192 Host kh\u1EA3 d\u1EE5ng. Ch\u1EC9 nh\u1EDB l\u1EF1a ch\u1ECDn sau l\u1EA7n g\u1EEDi th\xE0nh c\xF4ng.</dd><dt>L\u1EA7n \u0111\u1EA7u</dt><dd>Desktop / Web \u01B0u ti\xEAn local. Mobile h\u01B0\u1EDBng d\u1EABn remote. Draft \u0111\u01B0\u1EE3c gi\u1EEF trong khi k\u1EBFt n\u1ED1i.</dd></dl>${synthesis}${HOME.ui.demoNote}`,
            HOME.ui.button("host-guide", "Xem lu\u1ED3ng Host") +
              HOME.ui.button("close-modal", "\u0110\xF3ng"),
          );
        }),
        (HOME.ui.actions["activity-scope"] = () => {
          ((HOME.state.activityScope = HOME.state.activityScope === "project" ? "all" : "project"),
            (HOME.state.showAll = !1),
            HOME.ui.render());
        }),
        (HOME.ui.resetScenario = (id) => {
          ((HOME.state.activityScope = "all"),
            (HOME.state.contextChanged = !1),
            HOME.directionBase.reset(id));
        }));
      const directionPickContext = HOME.ui.pickContext;
      ((HOME.ui.pickContext = (kind, id) => {
        ((kind === "host" || kind === "project") && (HOME.state.contextChanged = !0),
          directionPickContext(kind, id));
      }),
        (HOME.ui.actions["choose-bot"] = (id) => {
          ((HOME.state.contextChanged = !0), HOME.ui.chooseBot(id));
        }),
        (HOME.ui.render = () => {
          ((HOME.state.concept = HOME.directions[HOME.direction].concept),
            HOME.directionBase.render(),
            document.querySelector("#app").classList.remove("rail"),
            document.querySelectorAll("[data-direction-link]").forEach((a) => {
              const selected = Number(a.dataset.directionLink) === HOME.direction;
              (a.classList.toggle("active", selected),
                selected && a.setAttribute("aria-current", "page"));
            }));
        }),
        HOME.ui.render());
    </script>
  </body>
</html>
