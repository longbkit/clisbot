apply plugin: 'com.android.library'

group = 'sh.clisbot.trace'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

dependencies {
  implementation "com.facebook.react:react-android"
}

android {
  namespace "sh.clisbot.trace"
  buildFeatures { buildConfig true }
  defaultConfig {
    buildConfigField "boolean", "SYNTHETIC_HERMES_SAMPLING", (System.getenv("CLISBOT_PROFILE_BUILD") == "1" && System.getenv("APP_VARIANT") == "development").toString()
    buildConfigField "boolean", "SYNTHETIC_REACT_PROFILE", (System.getenv("CLISBOT_PROFILE_BUILD") == "1" && System.getenv("APP_VARIANT") == "development" && System.getenv("CLISBOT_REACT_PROFILE") == "1").toString()
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
}
