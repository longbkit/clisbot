plugins {
  id 'com.android.library'
  // Expo 57's typed Function DSL requires the Pika compiler integration.
  id 'expo-module-gradle-plugin'
}

group = 'sh.clisbot.diffprototype'
version = '0.1.0'

// These app-local modules are private; only the application is packaged.
expoModule { canBePublished = false }


def skiaPackage = new File(["node", "--print", "require.resolve('@shopify/react-native-skia/package.json')"].execute(null, projectDir).text.trim()).parentFile

android {
  ndkVersion rootProject.ext.ndkVersion
  namespace "sh.clisbot.diffprototype"
  defaultConfig {
    externalNativeBuild {
      cmake {
        arguments "-DSKIA_PACKAGE=${skiaPackage.absolutePath}"
        cppFlags "-std=c++20 -O2 -fexceptions -frtti"
      }
    }
  }
  externalNativeBuild {
    cmake { path "CMakeLists.txt" }
  }
}
