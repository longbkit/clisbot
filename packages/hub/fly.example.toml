# Self-hosting example. Copy this file to fly.toml and replace the placeholders.
app = 'your-paseo-hub'
primary_region = 'iad'

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = 'production'
PORT = '3000'
PASEO_HUB_APP_URL = 'https://your-paseo-hub.fly.dev'
PASEO_HUB_TRUSTED_CLIENT_IP_HEADER = 'fly-client-ip'
PASEO_REGISTRATION_MODE = 'invite_only'
PASEO_ORGANIZATION_CREATION = 'disabled'
# Hub generates and durably stores its authentication secret on first start.
# Advanced deployments may override it with the PASEO_HUB_AUTH_SECRET app secret.

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
