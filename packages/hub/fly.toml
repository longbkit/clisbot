app = 'clisbot-cloud'
primary_region = 'sin'

[build]
  image = "ghcr.io/longbkit/clisbot:latest"

[env]
  CLISBOT_RUN_MODE = 'hub'
  NODE_ENV = 'production'
  PORT = '6870'
  CLISBOT_HUB_APP_URL = 'https://hub.paseo.sh'
  CLISBOT_HUB_TRUSTED_CLIENT_IP_HEADER = 'fly-client-ip'
  CLISBOT_REGISTRATION_MODE = 'disabled'
  CLISBOT_ORGANIZATION_CREATION = 'disabled'

[http_service]
  internal_port = 6870
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
