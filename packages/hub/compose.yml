services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clisbot_hub
      POSTGRES_USER: clisbot
      POSTGRES_PASSWORD: clisbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clisbot -d clisbot_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  hub:
    image: ghcr.io/longbkit/clisbot:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      CLISBOT_RUN_MODE: hub
      DATABASE_URL: postgres://clisbot:clisbot@postgres:5432/clisbot_hub
      PORT: 6870
    ports:
      - "6870:6870"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6870/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
