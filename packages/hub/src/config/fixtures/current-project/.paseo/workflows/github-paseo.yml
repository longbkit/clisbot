name: github-paseo
on: github.issue_comment
max_runtime: 2h
filters:
  repo: getpaseo/paseo
  from_users: [maintainer]
steps:
  - id: work
    environment: paseo
    max_runtime: 1h
    idle_timeout: 10m
    agent: codex
    github:
      connection: getpaseo
    prompt:
      - text: ${{ paseo.prompt }}
