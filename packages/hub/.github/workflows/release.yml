name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release metadata
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-metadata.mjs "${{ github.ref_name }}" "$RELEASE_NOTES_PATH"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            exit 0
          fi

          args=(--verify-tag --title "Clisbot Hub $RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
