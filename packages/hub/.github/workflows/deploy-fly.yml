name: Deploy Fly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-fly-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$HUB_SHA" != "$current_main" ]]; then
            echo "Skipping superseded commit $HUB_SHA; current main is $current_main"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - if: steps.gate.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
