pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      # Matches .oxlintrc.json ignorePatterns; oxlint fails when every passed file is ignored.
      exclude:
        - "docs/audits/**"
      run: npm run lint -- {staged_files}
    - name: typecheck
      # Workspace consumers resolve package declarations from dist; match CI's build-before-check order.
      run: npm run build:server-deps && npm run typecheck
